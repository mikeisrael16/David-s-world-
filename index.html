  say((first ? 'Это Гламп! ' : '') + 'Гламп хочет ' + w.n + '!', first ? 700 : 300);
}
function spawnItem(x, forceWant){
  let def;
  const haveWant = SG.items.some(i => i.def === SG.want && i.state !== 'eaten');
  if (forceWant || (!haveWant && SG.sinceWant >= 1)) def = SG.want;
  else if (Math.random() < 0.25) def = STRASH[Math.floor(Math.random()*STRASH.length)];
  else def = SFOODS[Math.floor(Math.random()*SFOODS.length)];
  if (def === SG.want) SG.sinceWant = 0; else SG.sinceWant++;
  const y = py(300 + Math.random()*900);
  SG.items.push({def, x: x ?? W + px(150), y, by:y, vx: -W*(0.04 + Math.random()*0.02), vy:0, rot:Math.random()*0.5 - 0.25,
                 vr:(Math.random() - 0.5)*0.6, ph:Math.random()*6, state:'float', t:0, sc:1});
}
function itemSize(it){ const im = IMG[it.def.k], s = py(it.def.trash ? 190 : 210); return {w: s*im.width/Math.max(im.width, im.height), h: s*im.height/Math.max(im.width, im.height)}; }
const mouthXY = () => [px(MOUTH.x), py(MOUTH.y) + monBob()];
const monBob = () => Math.sin(T*1.6)*py(18);

function spaceDown(x, y){
  if (R){ resultsTap(x, y); return; }
  if (dist(x, y, px(SHOME.x), py(SHOME.y)) < Math.min(px(SHOME.r), py(SHOME.r)*1.2)){ SFX.click(); changeScene('menu'); return; }
  if (dist(x, y, px(SSOUND.x), py(SSOUND.y)) < Math.min(px(SSOUND.r), py(SSOUND.r)*1.2)){ setSound(!soundOn); SFX.click(); return; }
  if (SG.win) return;
  // pick an item (topmost first)
  for (let i = SG.items.length - 1; i >= 0; i--){
    const it = SG.items[i]; if (it.state !== 'float') continue;
    const s = itemSize(it);
    if (Math.abs(x - it.x) < s.w*0.62 && Math.abs(y - it.y) < s.h*0.62){
      it.state = 'drag'; it.dx = it.x - x; it.dy = it.y - y; SG.drag = it;
      SG.items.splice(i, 1); SG.items.push(it); SFX.pick(); return;
    }
  }
  if (dist(x, y, px(THINK.x), py(THINK.y)) < px(THINK.w)*0.5){ say('Гламп хочет ' + SG.want.n + '!'); SG.wishPop = 0.01; return; }
  if (Math.abs(x - px(MON.x)) < px(220) && y > py(MON.feet - MON.h) && y < py(MON.feet)){ SFX.giggle(); SG.mon = 'open'; SG.monT = 0; say('Я Гламп! Я хочу ' + SG.want.n + '!'); return; }
  if (Math.abs(x - px(SDAV.x)) < px(170) && Math.abs(y - py(SDAV.y)) < py(170)){ SG.dav = 'happy'; SG.davT = 0; SFX.jump(); say('Покорми Глампа!'); }
}
function spaceMove(x, y){ const it = SG && SG.drag; if (!it) return; it.x = x + it.dx; it.y = y + it.dy; }
function spaceUp(){
  const it = SG && SG.drag; if (!it) return;
  SG.drag = null;
  const [mx, my] = mouthXY();
  if (dist(it.x, it.y, mx, my) < py(240)) feed(it);
  else { it.state = 'float'; it.by = it.y; it.ph = -T*1.3; }
}
function feed(it){
  if (it.def === SG.want){
    it.state = 'eaten'; it.t = 0; it.fx = it.x; it.fy = it.y;
    SG.mon = 'chew'; SG.monT = 0; SG.hueT = 2.6; SG.hue = 40 + Math.random()*260;
    SG.fed++; SG.starPop = 0;
    SFX.gulp(); setTimeout(SFX.chomp, 250); setTimeout(SFX.chomp, 550); setTimeout(SFX.yum, 900);
    const [mx, my] = mouthXY(); burstStars(mx, my, 24);
    for (let i=0;i<6;i++) setTimeout(() => { const [bx, by] = mouthXY(); addPart({x:bx + (Math.random()-0.5)*px(120), y:by, vx:(Math.random()-0.5)*60, vy:-80 - Math.random()*80, life:2.2, r:py(40 + Math.random()*40), kind:'img', img:'x_bubbles', vr:(Math.random()-0.5)}); }, 300 + i*180);
    SG.dav = 'happy'; SG.davT = 0;
    toast('Ням-ням!', '', '#7dff6b');
    if (SG.fed >= FEED_GOAL){ SG.win = true; SG.winT = 0; setTimeout(winSpace, 1300); say('Ням-ням! Вкусно!'); }
    else { say('Ням-ням! Вкусно!'); setTimeout(() => { if (SG && !SG.win) pickWish(); }, 1700); }
  } else if (it.def.trash){
    SG.mon = 'yuck'; SG.monT = 0; SG.trashT = 0;
    SFX.cough(); setTimeout(SFX.pff, 500);
    const [mx, my] = mouthXY();
    for (let i=0;i<3;i++) setTimeout(() => addPart({x:mx + px(60), y:my - py(20), vx:200 + Math.random()*120, vy:-60 - Math.random()*60, life:1.4, r:py(70 + i*20), kind:'img', img:'x_smoke'}), i*220);
    spit(it, 1.4);
    SG.dav = 'scared'; SG.davT = 0;
    toast('Фу!', 'Это мусор!', '#ff8a3d');
    say('Фу! Это мусор! Гламп это не ест!');
  } else {
    SG.mon = 'yuck'; SG.monT = 0; SG.trashT = -1;
    SFX.pff(); spit(it, 1);
    toast('Ноу-ноу!', 'Не то!', '#ffb03a');
    say('Нет-нет! Гламп хочет ' + SG.want.n + '!');
  }
}
function spit(it, power){ it.state = 'spit'; it.t = 0; it.vx = W*0.9*power; it.vy = -H*0.35; it.vr = 8; }
function winSpace(){
  if (!SG) return;
  SG.mon = 'happy'; SG.monT = 0; SG.dav = 'happy'; SG.davT = -3;
  SFX.win(); setTimeout(SFX.clap, 400); confetti(160);
  for (let i=0;i<6;i++) setTimeout(() => { if (!SG) return; burstStars(W*(0.2 + Math.random()*0.6), H*(0.2 + Math.random()*0.4), 28); SFX.star(); }, i*350);
  say('Ура! Гламп наелся! Спасибо, Давид!', 200);
  setTimeout(() => {
    if (!SG || scene !== 'space') return;
    R = {t:0, stars:3, shown:0, title:'Гламп сыт и счастлив!', line:'Накормлено: ' + FEED_GOAL + ' вкусняшек', again(){ newSpace(); playSong('space'); }};
  }, 4200);
}

function updSpace(dt){
  if (!SG) return;
  updResults(dt);
  SG.monT += dt; SG.davT += dt; SG.hueT -= dt; SG.blinkT -= dt;
  if (SG.wishPop !== undefined) SG.wishPop += dt;
  if (SG.starPop !== undefined) SG.starPop += dt;
  if (SG.blinkT < -0.14) SG.blinkT = 2 + Math.random()*3;
  // monster mood
  if (!SG.win){
    if (SG.mon === 'chew' && SG.monT > 1.6) SG.mon = 'idle';
    if (SG.mon === 'yuck' && SG.monT > 1.4) SG.mon = 'idle';
    if (SG.mon === 'open' && SG.monT > 0.8 && !SG.drag) SG.mon = 'idle';
    if (SG.drag && (SG.mon === 'idle' || SG.mon === 'open')){
      const [mx, my] = mouthXY(), near = dist(SG.drag.x, SG.drag.y, mx, my) < py(360);
      if (near && SG.mon !== 'open'){ SG.mon = 'open'; SG.monT = 0; SFX.boing(); }
      if (!near && SG.mon === 'open') SG.mon = 'idle';
      if (near) SG.monT = 0;
    }
  }
  if (SG.davT > 1.8 && SG.dav !== 'wave') SG.dav = 'wave';
  // spawn
  SG.spawnT -= dt;
  const floating = SG.items.filter(i => i.state === 'float').length;
  if (SG.spawnT <= 0 && floating < 5 && !SG.win){ spawnItem(); SG.spawnT = 2.2 + Math.random()*0.8; }
  // move items
  for (const it of SG.items){
    it.t += dt;
    if (it.state === 'float'){
      it.x += it.vx*dt; it.by += it.vy*dt; it.vy *= 0.98;
      it.y = it.by + Math.sin(T*1.3 + it.ph)*py(22); it.rot += it.vr*dt*0.3;
    } else if (it.state === 'spit'){
      it.x += it.vx*dt; it.y += it.vy*dt; it.vy += H*0.6*dt; it.vx *= 0.97; it.rot += it.vr*dt;
      if (it.t > 0.9){ it.state = 'float'; it.by = clamp(it.y, py(260), py(1250)); it.vx = -W*0.05; it.vy = 0; }
    } else if (it.state === 'eaten'){
      const k = Math.min(1, it.t/0.25), [mx, my] = mouthXY();
      it.x = lerp(it.fx, mx, k); it.y = lerp(it.fy, my, k); it.sc = 1 - k;
    }
  }
  SG.items = SG.items.filter(it => !(it.state === 'eaten' && it.t > 0.25) && it.x > -px(300) && it.x < W + px(600));
}

function drawSpace(){
  ctx.drawImage(IMG.bgspace, 0, 0, W, H);
  // satiety stars
  for (let i=0;i<FEED_GOAL;i++){
    const x = px(330 + i*100), y = py(140), on = i < SG.fed;
    let r = py(44);
    if (on && i === SG.fed - 1 && SG.starPop < 0.5) r *= 1 + Math.sin(SG.starPop/0.5*Math.PI)*0.5;
    ctx.save(); if (on){ ctx.shadowColor = '#ffe14f'; ctx.shadowBlur = 20; }
    drawStar(x, y, r, on ? '#ffd23f' : 'rgba(255,255,255,0.18)', on ? '#b06a00' : 'rgba(255,255,255,0.55)'); ctx.restore();
  }
  // David the astronaut
  { const im = IMG['s_d' + SG.dav], h = py(SDAV.h), w = h*im.width/im.height;
    let jy = Math.sin(T*1.2)*py(20), rot = Math.sin(T*0.9)*0.08;
    if (SG.dav === 'happy') { jy -= Math.abs(Math.sin(SG.davT*7))*py(40); rot = Math.sin(SG.davT*10)*0.1; }
    if (SG.dav === 'scared') { rot = Math.sin(SG.davT*35)*0.05; }
    ctx.save(); ctx.translate(px(SDAV.x), py(SDAV.y) + jy); ctx.rotate(rot); ctx.drawImage(im, -w/2, -h/2, w, h); ctx.restore(); }
  // monster
  const key = SG.mon === 'happy' ? (Math.floor(SG.monT*4) % 2 ? 's_chew' : 's_open') : 's_' + SG.mon;
  const mim = IMG[key], mh = py(MON.h), mw = mh*mim.width/mim.height;
  let rot = Math.sin(T*1.1)*0.03, sx = 1, sy = 1, ox = 0, jy = 0;
  const bob = monBob();
  if (SG.mon === 'chew'){ const c = Math.sin(SG.monT*18); sx = 1 + c*0.04; sy = 1 - c*0.04; }
  if (SG.mon === 'open'){ sx = 1.04; sy = 1.04; }
  if (SG.mon === 'yuck'){ if (SG.trashT === 0){ ox = Math.sin(SG.monT*70)*px(8); rot = Math.sin(SG.monT*50)*0.05; } else rot = Math.sin(SG.monT*22)*0.14*Math.max(0, 1 - SG.monT/1.2); }
  if (SG.mon === 'happy'){ jy = -Math.abs(Math.sin(SG.monT*5))*py(70); rot = Math.sin(SG.monT*6)*0.15; }
  let hue = 0;
  if (SG.hueT > 0) hue = SG.hue * Math.min(1, SG.hueT/0.5);
  if (SG.mon === 'happy') hue = (SG.monT*140) % 360;
  ctx.save(); ctx.translate(px(MON.x) + ox, py(MON.feet) + bob + jy); ctx.rotate(rot); ctx.scale(sx, sy);
  if (hue) ctx.filter = `hue-rotate(${Math.round(hue)}deg) saturate(1.3)`;
  // soft glow under monster
  ctx.drawImage(mim, -mw/2, -mh, mw, mh);
  ctx.filter = 'none';
  // blink (only idle face has 3 open eyes)
  if (SG.mon === 'idle' && SG.blinkT < 0){
    for (const fx of [0.36, 0.5, 0.64]){
      ctx.fillStyle = hue ? `hsl(${(290 + hue) % 360},60%,70%)` : '#c07ce0'; ctx.strokeStyle = '#3a1d4e'; ctx.lineWidth = py(4);
      ctx.beginPath(); ctx.ellipse(-mw/2 + mw*fx, -mh + mh*0.415, mw*0.072, mh*0.06, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-mw/2 + mw*fx - mw*0.06, -mh + mh*0.42); ctx.quadraticCurveTo(-mw/2 + mw*fx, -mh + mh*0.45, -mw/2 + mw*fx + mw*0.06, -mh + mh*0.42); ctx.stroke();
    }
  }
  // tongue lick when idle (little pink wiggle)
  if (SG.mon === 'idle' && Math.sin(T*0.7) > 0.93){ ctx.fillStyle = '#ff7aa8'; ctx.strokeStyle = '#7a1d3e'; ctx.lineWidth = py(4);
    ctx.beginPath(); ctx.ellipse(mw*0.12, -mh + mh*0.62, mw*0.05, mh*0.04 + Math.abs(Math.sin(T*12))*mh*0.015, 0.3, 0, 7); ctx.fill(); ctx.stroke(); }
  ctx.restore();
  // thought bubble with the wish
  if (!SG.win){
    const im = IMG.s_think, w = px(THINK.w), h = w*im.height/im.width;
    const fy = Math.sin(T*1.5 + 1)*py(10), p = SG.wishPop < 0.4 ? easeOutBack(SG.wishPop/0.4) : 1;
    ctx.save(); ctx.translate(px(THINK.x), py(THINK.y) + fy); ctx.scale(p, p);
    // bubble sprite: the round part is in the top-right; tail toward the monster (bottom-left)
    ctx.drawImage(im, -w*0.55, -h*0.42, w, h);
    const fim = IMG[SG.want.k], fs = w*0.44, fw = fs*fim.width/Math.max(fim.width, fim.height), fh = fs*fim.height/Math.max(fim.width, fim.height);
    const wob = 1 + Math.sin(T*3)*0.05;
    ctx.drawImage(fim, w*0.03 - fw*wob/2, -h*0.07 - fh*wob/2, fw*wob, fh*wob);
    ctx.restore();
  }
  // items
  for (const it of SG.items){
    const im = IMG[it.def.k], s = itemSize(it);
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); const sc = it.sc*(it.state === 'drag' ? 1.15 : 1); ctx.scale(sc, sc);
    if (it.state === 'drag'){ ctx.shadowColor = it.def === SG.want ? '#7dff6b' : 'rgba(255,255,255,0.6)'; ctx.shadowBlur = 30; }
    else if (it.def === SG.want && !SG.win){ ctx.shadowColor = '#fff59a'; ctx.shadowBlur = 18 + Math.sin(T*4)*10; }
    ctx.drawImage(im, -s.w/2, -s.h/2, s.w, s.h); ctx.restore();
  }
  drawParts();
  // hint hand: from the wanted item to the mouth
  if (!SG.drag && !SG.win && SG.fed === 0 && SG.monT > 4){
    const it = SG.items.find(i => i.def === SG.want && i.state === 'float' && i.x < W*0.95);
    if (it){ const [mx, my] = mouthXY(), k = (T*0.55) % 1, e = easeInOut(Math.min(1, k*1.2));
      ctx.save(); ctx.globalAlpha = k < 0.85 ? 0.9 : (1-k)*6; ctx.font = `${Math.round(H*0.11)}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('👆', lerp(it.x, mx, e), lerp(it.y, my, e)); ctx.restore(); }
  }
  if (!soundOn){ drawMuteX(px(SSOUND.x), py(SSOUND.y)); drawMuteX(px(SHOME.x), py(SHOME.y)); }
  if (R){ drawResults(); drawParts(); }
}

// ---------- toasts ----------
function drawToasts(dt){
  for (const t of toasts){
    t.t += dt;
    const k = t.t, a = k < 0.15 ? k/0.15 : k > t.life-0.3 ? Math.max(0,(t.life-k)/0.3) : 1;
    const s = k < 0.3 ? easeOutBack(k/0.3) : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W/2, H*0.2); ctx.scale(s, s);
    outlined(t.text, 0, 0, Math.round(Math.min(H*0.13, W*0.08)), t.color, '#2b145e');
    if (t.sub) outlined(t.sub, 0, H*0.1, Math.round(Math.min(H*0.055, W*0.035)), '#ffffff', '#2b145e');
    ctx.restore();
  }
  toasts = toasts.filter(t => t.t < t.life);
}

// ---------- start screen ----------
function drawStart(){
  if (IMG.menu && IMG.menu.complete) ctx.drawImage(IMG.menu, 0, 0, W, H);
  ctx.fillStyle = 'rgba(15,10,60,0.55)'; ctx.fillRect(0,0,W,H);
  const r = Math.min(W, H) * 0.17, p = 1 + Math.sin(T*4)*0.05;
  ctx.save(); ctx.translate(W/2, H*0.5); ctx.scale(p, p);
  const gr = ctx.createRadialGradient(0,-r*0.3,r*0.1,0,0,r); gr.addColorStop(0,'#ffcf4a'); gr.addColorStop(1,'#ff7b1c');
  ctx.fillStyle = gr; ctx.shadowColor = '#ffcf4a'; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
  ctx.shadowBlur = 0; ctx.lineWidth = r*0.08; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-r*0.3,-r*0.42); ctx.lineTo(r*0.48,0); ctx.lineTo(-r*0.3,r*0.42); ctx.closePath(); ctx.fill();
  ctx.restore();
  outlined('Мир Давида', W/2, H*0.17, Math.round(Math.min(H*0.14, W*0.09)), '#ffe14f', '#3a1d6e');
  outlined('Нажми, чтобы начать!', W/2, H*0.84, Math.round(Math.min(H*0.065, W*0.045)), '#ffffff', '#3a1d6e');
}

// ---------- input ----------
function pos(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (pointer.down && pointer.id !== e.pointerId) return;
  pointer.down = true; pointer.id = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch(_){}
  const [x, y] = pos(e);
  initAudio();
  if (!audioStarted && scene !== 'start'){ audioStarted = true; playSong(scene === 'pups' ? 'pups' : scene === 'game' ? 'game' : scene === 'words' ? 'words' : scene === 'dino' ? 'dino' : scene === 'build' ? 'build' : scene === 'space' ? 'space' : 'menu'); }
  if (scene === 'start'){ audioStarted = true; goFullscreen(); SFX.click(); playSong('menu'); say('Привет, Давид! Добро пожаловать в Мир Давида!'); changeScene('menu'); return; }
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) goFullscreen();
  if (fadeDir) return;
  if (scene === 'menu') menuTap(x, y);
  else if (scene === 'game') gameDown(x, y);
  else if (scene === 'pups') pupsDown(x, y);
  else if (scene === 'words') wordsDown(x, y);
  else if (scene === 'dino') dinoDown(x, y);
  else if (scene === 'build') buildDown(x, y);
  else if (scene === 'space') spaceDown(x, y);
});
cv.addEventListener('pointermove', e => { if (!pointer.down || e.pointerId !== pointer.id) return; e.preventDefault(); const [x,y] = pos(e); if (scene==='game') gameMove(x,y); else if (scene==='pups') pupsMove(x,y); else if (scene==='words') wordsMove(x,y); else if (scene==='build') buildMove(x,y); else if (scene==='space') spaceMove(x,y); });
function up(e){ if (e.pointerId !== pointer.id) return; pointer.down = false; pointer.id = null; const [x,y] = pos(e); if (scene==='game') gameUp(x,y); else if (scene==='pups') pupsUp(x,y); else if (scene==='words') wordsUp(x,y); else if (scene==='build') buildUp(x,y); else if (scene==='space') spaceUp(x,y); }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume(); });

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  ctx.clearRect(0, 0, W, H);
  updParts(dt);
  if (menuFlash){ menuFlash.t += dt; if (menuFlash.t > 0.9) menuFlash = null; }
  if (scene === 'start') { drawStart(); drawParts(); }
  else if (scene === 'menu'){ drawMenu(); drawParts(); }
  else if (scene === 'game'){ updGame(dt); drawGame(); if (R) drawParts(); }
  else if (scene === 'pups'){ updPups(dt); drawPups(); }
  else if (scene === 'words'){ updWords(dt); drawWords(); }
  else if (scene === 'dino'){ updDino(dt); drawDino(); }
  else if (scene === 'build'){ updBuild(dt); drawBuild(); }
  else if (scene === 'space'){ updSpace(dt); drawSpace(); }
  drawToasts(dt);
  // fade
  if (fadeDir){
    fade += dt * 3.2 * fadeDir;
    if (fadeDir > 0 && fade >= 1){ fade = 1; fadeDir = -1;
      scene = fadeTo; parts = []; toasts = [];
      R = null;
      if (scene === 'game'){ newGame(); playSong('game'); } else if (scene === 'pups'){ newPups(); playSong('pups'); } else if (scene === 'words'){ newWordsRound(WG ? WG.round + 1 : 0); playSong('words'); } else if (scene === 'dino'){ newDino(); playSong('dino'); } else if (scene === 'build'){ newBuild(); playSong('build'); } else if (scene === 'space'){ newSpace(); playSong('space'); } else if (scene === 'menu'){ playSong('menu'); }
    } else if (fadeDir < 0 && fade <= 0){ fade = 0; fadeDir = 0; }
    ctx.fillStyle = `rgba(255,255,255,${fade})`; ctx.fillRect(0,0,W,H);
  }
  requestAnimationFrame(frame);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
loadAll().then(() => requestAnimationFrame(frame));
</script>
