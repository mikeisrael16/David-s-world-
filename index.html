    bass: [43,43,48,48,50,50,43,43] },
};
let curSong = null, songPos = 0, songTime = 0, bassPos = 0, bassTime = 0, musicTimer = null;
function playSong(name){
  if (!AC) return;
  if (curSong === SONGS[name]) return;
  curSong = SONGS[name]; songPos = 0; bassPos = 0;
  songTime = bassTime = AC.currentTime + 0.1;
  if (!musicTimer) musicTimer = setInterval(schedMusic, 90);
}
function schedMusic(){
  if (!AC || !curSong) return;
  const beat = 60 / curSong.bpm, ahead = AC.currentTime + 0.35;
  while (songTime < ahead){
    const [n, b] = curSong.mel[songPos % curSong.mel.length];
    if (n){ tone(NOTE(n), songTime, b*beat*0.9, 'triangle', 0.22, null, musicGain);
            tone(NOTE(n+12), songTime, b*beat*0.5, 'sine', 0.04, null, musicGain); }
    songTime += b * beat; songPos++;
  }
  while (bassTime < ahead){
    const n = curSong.bass[bassPos % curSong.bass.length];
    tone(NOTE(n), bassTime, beat*0.8, 'sine', 0.3, null, musicGain);
    tone(NOTE(n+12), bassTime + beat, beat*0.3, 'triangle', 0.06, null, musicGain);
    bassTime += beat * 2; bassPos++;
  }
}

let ruVoice = null;
function pickVoice(){ if (!window.speechSynthesis) return; const vs = speechSynthesis.getVoices(); ruVoice = vs.find(v => /^ru/i.test(v.lang)) || null; }
if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, delay=0){
  if (!soundOn || !window.speechSynthesis) return;
  setTimeout(() => {
    if (!soundOn) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ru-RU'; if (ruVoice) u.voice = ruVoice;
      u.rate = 0.95; u.pitch = 1.15; u.volume = 1;
      if (musicGain) musicGain.gain.setTargetAtTime(0.05, AC.currentTime, 0.1);
      u.onend = () => { if (musicGain) musicGain.gain.setTargetAtTime(0.16, AC.currentTime, 0.3); };
      speechSynthesis.speak(u);
    } catch(e){}
  }, delay);
}

let parts = [];

function burstStars(x, y, n=14, col){
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = 120 + Math.random()*260;
    addPart({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,g:300,life:0.9+Math.random()*0.5,r:6+Math.random()*9,color:col||['#ffd23f','#ff6fb5','#5ce1e6','#8cff6b','#fff'][i%5],kind:'star',vr:(Math.random()-0.5)*8}); }

function confetti(n=120){
  for (let i=0;i<n;i++) addPart({x:Math.random()*W,y:-20-Math.random()*H*0.5,vx:(Math.random()-0.5)*80,vy:80+Math.random()*120,g:60,life:4+Math.random()*2,r:5+Math.random()*6,color:['#ffd23f','#ff6fb5','#5ce1e6','#8cff6b','#ff7a3d','#a78bff'][i%6],kind:'conf',vr:(Math.random()-0.5)*10});

function updParts(dt){
  for (const p of parts){ p.age += dt; p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt; }
  parts = parts.filter(p => p.age < p.life);
}
function drawParts(){
  for (const p of parts){
    const k = 1 - p.age/p.life;
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, k*1.5)) * (p.alpha ?? 1);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.kind === 'star') drawStar(0,0,p.r,p.color);
    else if (p.kind === 'conf'){ ctx.fillStyle = p.color; ctx.fillRect(-p.r/2,-p.r,p.r,p.r*2); }
    else if (p.kind === 'puff'){ const r = p.r*(1 + p.age/p.life*1.5); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); }
    else if (p.kind === 'img'){ const im = IMG[p.img]; if (im){ const w = p.r*2, h = w*im.height/im.width; ctx.drawImage(im, -w/2, -h/2, w, h); } }
    else if (p.kind === 'bubble'){ ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0,0,p.r,0,7); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fill(); }
    else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0,0,p.r,0,7); ctx.fill(); }
    ctx.restore();
  }
}

function vSize(def){
  const im = IMG[def.k]; const ar = im.width / im.height;
  let w = W * (def.big ? 0.22 : def.type==='water' ? 0.17 : def.type==='air' ? 0.17 : 0.15);
  let h = w / ar;
  const maxH = H * (def.k==='tr_00' ? 0.26 : 0.19);
  if (h > maxH){ h = maxH; w = h*ar; }
  return {w, h};
}
function spawnVehicle(){
  const def = G.queue[G.idx];
  const s = vSize(def);
  G.v = {def, x:px(SPAWN.x), y:py(SPAWN.y) - py(20), w:s.w, h:s.h, state:'spawn', t:0, rot:0, alpha:1, vx:0, vy:0, sc:0, dx:0, dy:0, bounced:false};
  G.idle = 0;
  SFX.pop(); burstStars(G.v.x, G.v.y, 12);
  say('Это ' + low(def.name) + '! Куда ' + (def.g==='f'?'её':'его') + '?');
}
function homeX(){ return px(SPAWN.x); } function homeY(){ return py(SPAWN.y) - py(20); }

let pointer = {down:false, id:null, x:0, y:0};
function gameDown(x, y){
  if (R){ resultsTap(x,y); return; }
  if (dist(x,y,px(HOME.x),py(HOME.y)) < Math.min(px(HOME.r), py(HOME.r))*1.3){ SFX.click(); changeScene('menu'); return; }
  const v = G.v;
  if (v && (v.state==='idle' || v.state==='spawn' || v.state==='return')){
    if (Math.abs(x - v.x) < v.w*0.6 && Math.abs(y - v.y) < Math.max(v.h*0.7, H*0.09)){
      v.state = 'drag'; v.dx = v.x - x; v.dy = v.y - y; v.sc = 1; G.idle = 0; SFX.pick();
    }
  }
}
function gameMove(x, y){ const v = G && G.v; if (v && v.state==='drag'){ v.x = x + v.dx; v.y = y + v.dy; } }
function gameUp(x, y){
  const v = G && G.v; if (!v || v.state !== 'drag') return;
  if (inSpawn(v.x, v.y)){ v.state = 'return'; v.t = 0; v.fx = v.x; v.fy = v.y; SFX.drop(); return; }
  const zone = zoneAt(v.x, v.y + v.h*0.25);
  const def = v.def; v.t = 0; v.zone = zone;
  if (zone === def.type){
    v.state = 'snap'; v.fx = v.x; v.fy = v.y;
    if (zone === 'land'){ v.ty = roadY(v.x) - v.h/2; }
    else if (zone === 'air'){ v.ty = clamp(v.y, py(150) + v.h/2, skyBottom() - v.h*0.45); }
    else { v.ty = clamp(v.y, waterTop(v.x) + py(70), H - v.h*0.45) ; }
    G.correct++;
    SFX.win(); burstStars(v.x, v.y, 22);
    toast('Молодец!', def.type==='land' ? 'Едет по дороге!' : def.type==='air' ? 'Летит по небу!' : 'Плывёт по воде!', '#7dff6b');
    const verb = def.type==='land' ? 'едет по дороге' : def.type==='air' ? 'летит по небу' : 'плывёт по воде';
    say('Молодец! ' + def.name + ' ' + verb + '!');
    setTimeout(() => { if (def.type==='land'){ SFX.car(); setTimeout(SFX.horn, 900); } else if (def.type==='air'){ def.heli ? SFX.heli() : SFX.plane(); } else SFX.ship(); }, 350);
  } else {
    const where = def.type==='land' ? 'ездит по дороге' : def.type==='air' ? 'летает в небе' : 'плавает по воде';
    const kind = def.type==='land' ? (def.g==='f'?'Машина':def.name) : def.name;
    if (zone === 'water'){
      v.state = 'sink'; v.vy = 0; SFX.splash();
      for (let i=0;i<14;i++){ const a = -Math.PI/2 + (Math.random()-0.5)*1.6, s = 150+Math.random()*220;
        addPart({x:v.x+(Math.random()-0.5)*v.w*0.6, y:v.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, g:600, life:0.8, r:4+Math.random()*6, color:'rgba(220,245,255,0.95)'}); }
      toast('Ой! ' + past('Утонул', def.g) + '!', kind + ' ' + where, '#ff9a3d');
      say('Ой! ' + def.name + ' ' + past('утонул', def.g) + '! ' + def.name + ' ' + where + '.');
    } else if (zone === 'air'){
      v.state = 'fall'; v.vy = -80; v.vr = (Math.random()<0.5?-1:1) * (2+Math.random()*2); SFX.fall();
      toast('Ой! ' + past('Упал', def.g) + '!', kind + ' не умеет летать', '#ff9a3d');
      say('Ой! ' + def.name + ' ' + past('упал', def.g) + '! ' + def.name + ' ' + where + '.');
    } else {
      v.state = 'sos'; v.fx = v.x; v.fy = v.y;
      v.ty = clamp(v.y, skyBottom() + v.h*0.1, waterTop(v.x) - v.h*0.35);
      SFX.sos();
      toast('SOS!', def.name + ' ' + past('застрял', def.g) + '!', '#ff5050');
      say('Помогите! ' + def.name + ' ' + past('застрял', def.g) + '! ' + def.name + ' ' + where + '.', 900);
    }
  }
}
function finishVehicle(){
  G.v = null; G.done++; G.idx++;
  if (G.idx >= G.queue.length){ setTimeout(showResults, 400); G.wait = 99; }
  else G.wait = 0.5;
}
function showResults(){
  const n = G.correct;
  const stars = n >= 9 ? 3 : n >= 6 ? 2 : 1;
  R = {t:0, stars, shown:0, title: n >= 6 ? 'Ура! Отлично!' : 'Молодец!', line:'Правильно: ' + n + ' из ' + TOTAL, again(){ newGame(); playSong('game'); }};
  SFX.win(); confetti(140); playSong('menu');
  say((n >= 6 ? 'Ура! Отлично, Давид! ' : 'Молодец, Давид! ') + 'Правильно ' + n + ' из ' + TOTAL + '!', 300);
}
function resultsBtns(){
  const bw = Math.min(W*0.24, 300), bh = Math.min(H*0.14, 90), cy = H*0.79;
  return [{id:'again', x:W/2 - bw - 15, y:cy - bh/2, w:bw, h:bh, label:'Ещё раз ↻', col:'#3fcf4a'},
          {id:'menu',  x:W/2 + 15,      y:cy - bh/2, w:bw, h:bh, label:'Меню ⌂',   col:'#ff9a2e'}];
}
function resultsTap(x, y){
  if (R.t < 0.8) return;
  for (const b of resultsBtns()) if (x>b.x && x<b.x+b.w && y>b.y && y<b.y+b.h){
    SFX.click();
    if (b.id === 'again') R.again(); else changeScene('menu');
  }
}

function updResults(dt){
  if (!R) return;
  const r = R; r.t += dt;
  const want = Math.min(r.stars, Math.floor((r.t - 0.6) / 0.45) + 1);
  if (r.t > 0.6 && want > r.shown){ r.shown = want; SFX.star(); burstStars(W/2 + (r.shown-2)*Math.min(W*0.13,150), H*0.42, 16); }
}
function updGame(dt){
  const v = G.v;
  if (!v && !R){ G.wait -= dt; if (G.wait <= 0 && G.idx < G.queue.length) spawnVehicle(); }
  updResults(dt);
  if (!v) return;
  v.t += dt;
  switch (v.state){
    case 'spawn': v.sc = easeOutBack(Math.min(1, v.t/0.5)); if (v.t >= 0.5){ v.state='idle'; v.t=0; v.sc=1; } break;
    case 'idle': G.idle += dt; v.y = homeY() + Math.sin(T*3)*py(10); break;
    case 'return': { const k = Math.min(1, v.t/0.35); v.x = lerp(v.fx, homeX(), k); v.y = lerp(v.fy, homeY(), k); if (k>=1){ v.state='idle'; v.t=0; } break; }
    case 'snap': { const k = Math.min(1, v.t/0.3); v.y = lerp(v.fy, v.ty, k); if (k>=1){ v.state='go'; v.t=0; v.baseY = v.ty; } break; }
    case 'go': {
      const type = v.def.type;
      const spd = type==='land' ? W*0.42 : type==='air' ? W*0.4 : W*0.2;
      const acc = Math.min(1, v.t/0.6);
      v.x -= spd * acc * dt;
      if (type==='land'){ v.y = roadY(v.x) - v.h/2 - Math.abs(Math.sin(T*18))*py(4); v.rot = Math.sin(T*18)*0.012;
        if (Math.random() < 0.6) addPart({x:v.x + v.w*0.45, y:v.y + v.h*0.42, vx:60+Math.random()*60, vy:-20-Math.random()*30, life:0.6, r:5+Math.random()*5, color:'rgba(205,190,160,0.7)', kind:'puff'}); }
      else if (type==='air'){ v.y = v.baseY - v.t*py(60) + Math.sin(v.t*4)*py(14); v.rot = 0.08 + Math.sin(v.t*4)*0.04;
        if (v.def.heli) v.rot = -0.06 + Math.sin(v.t*5)*0.03;
        if (Math.random() < 0.5) addPart({x:v.x + v.w*0.48, y:v.y + (Math.random()-0.5)*v.h*0.2, vx:40, vy:0, life:0.9, r:6+Math.random()*6, color:'rgba(255,255,255,0.75)', kind:'puff'}); }
      else { v.y = v.baseY + Math.sin(v.t*3)*py(6); v.rot = Math.sin(v.t*2.4)*0.05;
        if (Math.random() < 0.7) addPart({x:v.x + v.w*(0.3+Math.random()*0.2), y:v.y + v.h*0.42, vx:50+Math.random()*60, vy:-60-Math.random()*60, g:300, life:0.6, r:3+Math.random()*4, color:'rgba(240,250,255,0.9)'}); }
      if (v.x + v.w/2 < -20 || v.y + v.h < -20) finishVehicle();
      break;
    }
    case 'sink': {
      v.vy = Math.min(v.vy + 120*dt, 70); v.y += v.vy*dt; v.rot = Math.min(0.5, v.t*0.35) * (v.def.type==='air'?-1:1);
      v.x += Math.sin(v.t*5)*0.6;
      v.alpha = clamp(1 - (v.t-0.6)/1.8, 0, 1);
      if (Math.random() < 0.5) addPart({x:v.x + (Math.random()-0.5)*v.w*0.6, y:v.y - v.h*0.2, vx:(Math.random()-0.5)*20, vy:-60-Math.random()*60, life:1.2, r:3+Math.random()*6, kind:'bubble'});
      if (v.t > 2.6) finishVehicle();
      break;
    }
    case 'fall': {
      if (!v.landed){
        v.vy += 1400*dt; v.y += v.vy*dt; v.rot += v.vr*dt;
        const gy = Math.max(roadY(v.x), skyBottom() + py(120)) ;
        if (v.y + v.h*0.3 >= gy){ v.y = gy - v.h*0.3; v.landed = true; v.t = 0; SFX.thud();
          for (let i=0;i<16;i++) addPart({x:v.x+(Math.random()-0.5)*v.w, y:v.y + v.h*0.25, vx:(Math.random()-0.5)*260, vy:-40-Math.random()*120, g:100, life:1, r:10+Math.random()*12, color:'rgba(150,140,130,0.6)', kind:'puff'});
          burstStars(v.x, v.y - v.h*0.4, 6, '#ffd23f'); }
      } else {
        v.rot += (Math.PI*Math.round(v.rot/Math.PI) - v.rot) * Math.min(1, dt*6);
        v.alpha = clamp(1 - (v.t-1.0)/0.8, 0, 1);
        if (v.t > 1.9) finishVehicle();
      }
      break;
    }
    case 'sos': {
      const k = Math.min(1, v.t/0.3); v.y = lerp(v.fy, v.ty, k);
      v.rot = Math.sin(v.t*20) * 0.03 * (v.t < 2 ? 1 : 0);
      v.alpha = clamp(1 - (v.t-2.6)/0.6, 0, 1);
      if (v.t > 3.3) finishVehicle();
      break;
    }
  }
}

function drawGame(){
  ctx.drawImage(IMG.bg, 0, 0, W, H);
  const v = G.v;
  // zone highlight while dragging
  if (v && v.state === 'drag'){
    const z = zoneAt(v.x, v.y + v.h*0.25);
    if (!inSpawn(v.x, v.y)){
      ctx.save(); ctx.globalAlpha = 0.18 + Math.sin(T*8)*0.06; ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      if (z === 'air'){ ctx.rect(0, 0, W, skyBottom()); }
      else if (z === 'land'){ ctx.moveTo(0, skyBottom()); ctx.lineTo(W, skyBottom()); ctx.lineTo(W, waterTop(W)+py(25)); ctx.lineTo(0, waterTop(0)+py(25)); }
      else { ctx.moveTo(0, waterTop(0)+py(25)); ctx.lineTo(W, waterTop(W)+py(25)); ctx.lineTo(W, H); ctx.lineTo(0, H); }
      ctx.fill(); ctx.restore();
    }
  }
  // board glow
  if (v && (v.state==='idle' || v.state==='spawn')){
    const p = (Math.sin(T*4)+1)/2;
    ctx.save(); ctx.globalAlpha = 0.35 + p*0.35; ctx.strokeStyle = '#fff59a'; ctx.lineWidth = 5; ctx.shadowColor = '#fff59a'; ctx.shadowBlur = 20;
    roundRect(px(SPAWN.x - SPAWN.w/2), py(SPAWN.y - SPAWN.h/2), px(SPAWN.w), py(SPAWN.h), py(40)); ctx.stroke(); ctx.restore();
  }
  drawParts();
  if (v) drawVehicle(v);
  // hint hand
  if (v && v.state==='idle' && (G.idx===0 || G.idle > 5)){
    const k = (T*0.7) % 1;
    const hx = lerp(v.x, W*0.45, easeInOut(k)), hy = lerp(v.y, H*0.55, easeInOut(k));
    ctx.save(); ctx.globalAlpha = k < 0.85 ? 0.9 : (1-k)*6; ctx.font = `${Math.round(H*0.11)}px serif`; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('👆', hx, hy); ctx.restore();
  }
  // SOS bubble
  if (v && v.state === 'sos' && v.alpha > 0){
    const bx = v.x, by = v.y - v.h/2 - H*0.07, on = Math.floor(v.t*4)%2===0;
    ctx.save(); ctx.globalAlpha = v.alpha;
    ctx.fillStyle = on ? '#ff3b3b' : '#ffffff'; ctx.strokeStyle = '#7a0b0b'; ctx.lineWidth = 4;
    const bw = H*0.2, bh = H*0.1;
    roundRect(bx - bw/2, by - bh/2, bw, bh, bh*0.4); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx - 10, by + bh/2 - 2); ctx.lineTo(bx, by + bh/2 + 16); ctx.lineTo(bx + 10, by + bh/2 - 2); ctx.fill();
    ctx.font = `900 ${Math.round(bh*0.62)}px Arial,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = on ? '#fff' : '#e3161b'; ctx.fillText('SOS', bx, by + 2);
    ctx.restore();
  }
  drawHud(G.done, TOTAL, G.correct);
  if (!soundOn) drawMuteX(px(HOME.x), py(HOME.y));
  if (R) drawResults();
}
function drawHud(done, total, count){
  const bx0 = px(318), by0 = py(52), bw = px(150), bh = py(58);
  ctx.save(); roundRect(bx0, by0, bw, bh, bh/2); ctx.clip();
  const gr = ctx.createLinearGradient(0, by0, 0, by0+bh); gr.addColorStop(0,'#8cff6b'); gr.addColorStop(1,'#2fb33a');
  ctx.fillStyle = gr; ctx.fillRect(bx0, by0, bw*done/total, bh); ctx.restore();
  outlined(done + '/' + total, bx0 + bw/2, by0 + bh/2 + 1, Math.round(bh*0.62), '#fff', '#5a3410');
  if (count !== null){
    const cx = px(560), cy = py(82);
    drawStar(cx, cy, py(50), '#ffd23f', '#b06a00');
    outlined('× ' + count, cx + py(62), cy + 2, Math.round(py(64)), '#fff', '#2c5e9e', 'left');
  }
}
const easeInOut = t => t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;

function drawVehicle(v){
  const im = IMG[v.def.k];
  ctx.save(); ctx.globalAlpha = v.alpha;
  ctx.translate(v.x, v.y);
  // shadow on road
  if ((v.state==='go' && v.def.type==='land') || v.state==='sos' || (v.state==='fall' && v.landed)){
    ctx.save(); ctx.globalAlpha = 0.25*v.alpha; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(0, v.h*0.47, v.w*0.45, v.h*0.08, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  ctx.rotate(v.rot);
  let s = v.state==='spawn' ? v.sc : v.state==='drag' ? 1.12 : 1;
  if (v.state === 'drag'){ ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 25; ctx.shadowOffsetY = 18; }
  // sinking: clip to above waterline effect
  if (v.state === 'sink'){
    if (v.wy === undefined) v.wy = v.y - v.h*0.05;
    ctx.restore();
    const wyS = v.wy;
    // part above water: full; below water: faded blue
    for (const below of [false, true]){
      ctx.save(); ctx.beginPath();
      if (below) ctx.rect(0, wyS, W, H); else ctx.rect(0, 0, W, wyS);
      ctx.clip(); ctx.globalAlpha = v.alpha * (below ? 0.35 : 1);
      ctx.translate(v.x, v.y); ctx.rotate(v.rot);
      ctx.drawImage(im, -v.w/2, -v.h/2, v.w, v.h); ctx.restore();
    }
    // ripples
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3;
    for (let i=0;i<2;i++){ const rr = ((v.t*0.8 + i*0.5) % 1); ctx.globalAlpha = 1-rr;
      ctx.beginPath(); ctx.ellipse(v.x, wyS, v.w*(0.3+rr*0.5), v.h*(0.06+rr*0.08), 0, 0, 7); ctx.stroke(); }
    ctx.restore();
    return;
  }
  // helicopter rotor blur
  if (v.def.heli && v.state==='go'){
    ctx.save(); ctx.globalAlpha = 0.35 + 0.25*Math.abs(Math.sin(T*30)); ctx.fillStyle = '#e6eef5';
    ctx.beginPath(); ctx.ellipse(-v.w*0.06, -v.h*0.38, v.w*0.42*Math.abs(Math.cos(T*25)) + v.w*0.1, v.h*0.04, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  ctx.drawImage(im, -v.w/2*s, -v.h/2*s, v.w*s, v.h*s);
  ctx.restore();
}

function drawResults(){
  const r = R, k = Math.min(1, r.t/0.4);
  ctx.save(); ctx.fillStyle = `rgba(20,15,74,${0.55*k})`; ctx.fillRect(0,0,W,H); ctx.restore();
  const pw = Math.min(W*0.7, 720), ph = Math.min(H*0.82, 520), x = W/2 - pw/2, y = H/2 - ph/2 + (1-easeOutBack(k))*H*0.3;
  ctx.save();
  const gr = ctx.createLinearGradient(0, y, 0, y+ph); gr.addColorStop(0, '#6a5cff'); gr.addColorStop(1, '#3a2bb8');
  ctx.fillStyle = gr; ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 8; roundRect(x, y, pw, ph, 40); ctx.fill(); ctx.stroke();
  ctx.restore();
  outlined(r.title, W/2, y + ph*0.13, Math.round(Math.min(ph*0.13, pw*0.09)), '#ffe14f', '#3a1d6e');
  const sr = Math.min(W*0.06, ph*0.13);
  for (let i=0;i<3;i++){
    const sx = W/2 + (i-1)*Math.min(W*0.13,150), sy = y + ph*0.36;
    const on = i < r.shown;
    ctx.save(); ctx.translate(sx, sy); if (on){ const bob = Math.sin(T*3+i)*0.06; ctx.scale(1+bob,1+bob); }
    drawStar(0, 0, sr*(i===1?1.2:1), on ? '#ffd23f' : 'rgba(255,255,255,0.18)', on ? '#b06a00' : 'rgba(255,255,255,0.35)'); ctx.restore();
  }
  outlined(r.line, W/2, y + ph*0.58, Math.round(Math.min(ph*0.1, pw*0.07)), '#ffffff', '#1d1470');
  for (const b of resultsBtns()){
    ctx.save(); ctx.fillStyle = b.col; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.shadowColor='rgba(0,0,0,0.3)'; ctx.shadowBlur=12; ctx.shadowOffsetY = 6;
    roundRect(b.x, b.y, b.w, b.h, b.h/2); ctx.fill(); ctx.shadowColor='transparent'; ctx.stroke(); ctx.restore();
    outlined(b.label, b.x + b.w/2, b.y + b.h/2 + 2, Math.round(b.h*0.38), '#fff', 'rgba(0,0,0,0.35)');
  }
}

  {id:'chase',    name:'Гонщик', gen:'Гонщика', spotX:2290, col:'#1e63c8'},
];
const PUP_SLOTS = [1590, 1755, 1920, 2085, 2250, 2415];
const PUP_FEET = 482, PARK_Y = 1300, LANE_Y = 1104;
const PARADE = [[-500,862],[300,856],[700,866],[1000,884],[1300,896],[1700,870],[2100,830],[2576,828],[3300,828]];
let P = null;
function newPups(){
  const order = PUPS.map((d,i)=>i).sort(()=>Math.random()-0.5);
  P = {pups:[], cars:[], placed:0, mistakes:0, phase:'play', idle:0, endT:0};
  order.forEach((di, slot) => P.pups.push({d:PUPS[di], slot, x:0, y:0, state:'idle', t:0, sc:1, ph:Math.random()*6, alpha:1}));
  PUPS.forEach(d => P.cars.push({d, state:'parked', t:0, filled:false, x:px(d.spotX), y:py(PARK_Y), alpha:1, sc:1, err:0, glow:0}));
  R = null;
  say('Помоги щенкам найти свои машины!', 700);
}
function pupSize(p){ const im = IMG['pup_'+p.d.id]; const h = py(205); return {w: h*im.width/im.height, h}; }
function pupHome(p){ return [px(PUP_SLOTS[p.slot]), py(PUP_FEET)]; }
function carSize(c){
  const im = IMG[(c.filled ? 'full_' : 'empty_') + c.d.id], ar = im.width / im.height;
  let w = px(330), h = w / ar; const mh = py(c.filled ? 290 : 255);
  if (h > mh){ h = mh; w = h * ar; }
  return {w: w*c.sc, h: h*c.sc};
}
function carAt(x, y){
  for (const c of P.cars){
    if (c.state !== 'parked') continue;
    const s = carSize(c);
    if (Math.abs(x - c.x) < s.w*0.62 && y > c.y - s.h*1.45 && y < c.y + s.h*0.25) return c;
  }
  return null;
}
// parade path in screen coords
function paradePos(dist){
  const pts = PARADE.map(([u,v]) => [px(u), py(v + 28)]);
  for (let i=0;i<pts.length-1;i++){
    const [x0,y0] = pts[i], [x1,y1] = pts[i+1], L = Math.hypot(x1-x0, y1-y0);
    if (dist <= L) return [lerp(x0,x1,dist/L), lerp(y0,y1,dist/L), Math.atan2(y1-y0, x1-x0)];
    dist -= L;
  }
  const e = pts[pts.length-1]; return [e[0] + dist, e[1], 0];
}

function pupsDown(x, y){
  if (R){ resultsTap(x, y); return; }
  if (dist(x,y,px(HOME.x),py(HOME.y)) < Math.min(px(HOME.r), py(HOME.r))*1.3){ SFX.click(); changeScene('menu'); return; }
  if (P.phase !== 'play') return;
  for (const p of [...P.pups].reverse()){
    if (p.state !== 'idle') continue;
    const s = pupSize(p);
    if (Math.abs(x - p.x) < s.w*0.75 && y < p.y + s.h*0.15 && y > p.y - s.h*1.1){
      p.state = 'drag'; p.dx = p.x - x; p.dy = p.y - y; p.sx = x; p.sy = y; p.moved = 0; P.idle = 0;
      SFX.bark(); return;
    }
  }
}
function pupsMove(x, y){
  const p = P && P.pups.find(q => q.state === 'drag'); if (!p) return;
  p.moved = Math.max(p.moved, dist(x, y, p.sx, p.sy));
  p.x = x + p.dx; p.y = y + p.dy;
  const s = pupSize(p), c = carAt(p.x, p.y - s.h*0.5);
  for (const k of P.cars) k.glow = (k === c) ? 1 : 0;
}
function pupsUp(x, y){
  const p = P && P.pups.find(q => q.state === 'drag'); if (!p) return;
  for (const k of P.cars) k.glow = 0;
  const s = pupSize(p), c = carAt(p.x, p.y - s.h*0.5);
  p.t = 0; p.fx = p.x; p.fy = p.y;
  if (!c){
    p.state = 'return';
    if (p.moved < 14) say(p.d.name + '!');
    return;
  }
  if (c.d.id === p.d.id){
    p.state = 'into'; p.car = c; c.state = 'taken'; P.placed++;
    SFX.win(); burstStars(c.x, c.y - carSize(c).h*0.6, 20);
    toast('Молодец!', p.d.name + ' в своей машине!', '#7dff6b');
    say('Молодец! ' + p.d.name + ' в своей машине! Поехали!');
  } else {
    P.mistakes++; p.state = 'wrong'; c.err = 1;
    SFX.wrong();
    toast('Неправильно!', 'Это машина ' + c.d.gen, '#ff5050');
    say('Неправильно! Это машина ' + c.d.gen + '. Попробуй ещё!');
  }
}

function updPups(dt){
  if (!P) return;
  updResults(dt);
  if (P.phase === 'play' && !P.pups.some(p => p.state === 'drag')) P.idle += dt;
  for (const p of P.pups){
    p.t += dt;
    const [hx, hy] = pupHome(p);
    if (p.state === 'idle'){ p.x = hx; p.y = hy - Math.pow(Math.max(0, Math.sin(T*2.1 + p.ph)), 6)*py(30); p.sc = 1; }
    else if (p.state === 'return'){
      const k = Math.min(1, p.t/0.6);
      p.x = lerp(p.fx, hx, easeInOut(k)); p.y = lerp(p.fy, hy, easeInOut(k)) - Math.sin(k*Math.PI)*py(170);
      if (k >= 1){ p.state = 'idle'; SFX.drop(); }
    }
    else if (p.state === 'wrong'){
      p.x = p.fx + Math.sin(p.t*45)*px(14)*(1 - p.t/0.7);
      if (p.t > 0.7){ p.state = 'return'; p.t = 0; p.fx = p.x; p.fy = p.y; SFX.jump(); }
    }
    else if (p.state === 'into'){
      const k = Math.min(1, p.t/0.4), c = p.car, cs = carSize(c);
      p.x = lerp(p.fx, c.x + cs.w*0.05, k); p.y = lerp(p.fy, c.y - cs.h*0.45, k) - Math.sin(k*Math.PI)*py(60);
      p.sc = 1 - 0.55*k; p.alpha = 1 - k*k;
      if (k >= 1){ p.state = 'done'; c.filled = true; c.state = 'happy'; c.t = 0; SFX.pop(); SFX.bark();
        burstStars(c.x, c.y - carSize(c).h*0.5, 24); }
    }
  }
  for (const c of P.cars){
    c.t += dt; c.err = Math.max(0, c.err - dt*1.3);
    const s = carSize(c);
    if (c.state === 'happy'){
      c.x = px(c.d.spotX); c.y = py(PARK_Y) - Math.abs(Math.sin(c.t*9))*py(26)*(c.t < 1.2 ? 1 : 0);
      if (c.t > 0.3 && !c.honked){ c.honked = true; SFX.horn(); }
      if (c.t > 1.4){ c.state = 'leave'; c.t = 0; c.fy = py(PARK_Y); SFX.car(); }
    } else if (c.state === 'leave'){
      if (c.t < 0.55){ c.y = lerp(c.fy, py(LANE_Y), easeInOut(c.t/0.55)); }
      else {
        c.y = py(LANE_Y) - Math.abs(Math.sin(T*16))*py(5);
        c.x += W*0.55*Math.min(1, (c.t-0.55)/0.6)*dt;
        if (Math.random() < 0.6) addPart({x:c.x - s.w*0.45, y:c.y - s.h*0.08, vx:-50-Math.random()*60, vy:-20-Math.random()*30, life:0.6, r:5+Math.random()*6, color:'rgba(190,190,190,0.7)', kind:'puff'});
      }
      if (c.x - s.w/2 > W + 10) c.state = 'gone';
    } else if (c.state === 'parade'){
      if (c.t < 0) continue;
      const [x, y, a] = paradePos(c.t * W*0.36);
      c.x = x; c.y = y - Math.abs(Math.sin(T*14 + c.d.spotX))*py(6); c.rot = a*0.6;
      if (Math.random() < 0.4 && c.x > 0 && c.x < W) addPart({x:c.x - s.w*0.45, y:c.y - s.h*0.1, vx:-40, vy:-20, life:0.5, r:4+Math.random()*5, color:'rgba(210,200,170,0.7)', kind:'puff'});
    }
  }
  // all placed -> parade -> results
  if (P.phase === 'play' && P.cars.every(c => c.state === 'gone')){
    P.phase = 'parade'; P.endT = 0;
    P.cars.forEach((c, i) => { c.state = 'parade'; c.t = -i*0.75; c.sc = 0.82; c.x = -W; c.y = py(860); });
    SFX.win(); playSong('pupsParade');
    toast('Ура!', 'Все щенки на месте!', '#ffe14f');
    say('Ура! Все щенки на месте! Щенки спешат на помощь!');
  }
  if (P.phase === 'parade'){
    P.endT += dt;
    if (P.cars.every(c => c.x - carSize(c).w > W) || P.endT > 14){
      P.phase = 'results';
      const m = P.mistakes, stars = m === 0 ? 3 : m <= 2 ? 2 : 1;
      R = {t:0, stars, shown:0, title:'Все щенки на месте!', line: m === 0 ? 'Без ошибок! Супер!' : 'Ошибок: ' + m,
           again(){ newPups(); playSong('pups'); }};
      SFX.win(); confetti(150);
      say(m === 0 ? 'Супер, Давид! Ни одной ошибки!' : 'Молодец, Давид! Все щенки поехали на работу!', 400);
    }
  }
}

function drawPups(){
  ctx.drawImage(IMG.bgpups, 0, 0, W, H);
  // parking spots: check marks for done
  for (const c of P.cars){
    if (c.state === 'parked' || c.state === 'taken') continue;
    const x = px(c.d.spotX - 70), y = py(1368);
    ctx.save(); ctx.translate(x, y); ctx.scale(1 + Math.sin(T*4)*0.06, 1 + Math.sin(T*4)*0.06);
    drawStar(0, 0, py(46), '#ffd23f', '#b06a00'); ctx.restore();
  }
  // shadows of puppies on platform
  for (const p of P.pups){
    if (p.state !== 'idle') continue;
    const [hx, hy] = pupHome(p), s = pupSize(p);
    ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = '#5a3a14';
    ctx.beginPath(); ctx.ellipse(hx, hy - py(4), s.w*0.42, py(12), 0, 0, 7); ctx.fill(); ctx.restore();
  }
  // cars sorted by depth
  const cars = P.cars.filter(c => c.state !== 'gone').sort((a,b) => a.y - b.y);
  for (const c of cars) drawPupCar(c);
  drawParts();
  // puppies (dragged last)
  const order = [...P.pups].sort((a,b) => (a.state==='drag') - (b.state==='drag'));
  for (const p of order){
    if (p.state === 'done') continue;
    const im = IMG['pup_'+p.d.id], s = pupSize(p);
    const sc = p.sc * (p.state === 'drag' ? 1.15 : 1);
    ctx.save(); ctx.globalAlpha = p.alpha;
    if (p.state === 'drag'){ ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 16; }
    ctx.drawImage(im, p.x - s.w*sc/2, p.y - s.h*sc, s.w*sc, s.h*sc);
    ctx.restore();
    if (p.state === 'wrong'){
      ctx.save(); ctx.globalAlpha = 1 - p.t/0.7; ctx.strokeStyle = '#ff2b2b'; ctx.lineWidth = py(16); ctx.lineCap = 'round';
      const r = s.h*0.35, cx = p.x, cy = p.y - s.h*0.5;
      ctx.beginPath(); ctx.moveTo(cx-r, cy-r); ctx.lineTo(cx+r, cy+r); ctx.moveTo(cx+r, cy-r); ctx.lineTo(cx-r, cy+r); ctx.stroke(); ctx.restore();
    }
  }
  // hint hand: from an idle pup to its car
  if (P.phase === 'play' && (P.idle > 6 || (P.placed === 0 && P.idle > 2.5 && P.mistakes === 0))){
    const p = P.pups.find(q => q.state === 'idle');
    const c = p && P.cars.find(k => k.d.id === p.d.id);
    if (p && c){
      const k = (T*0.55) % 1, e = easeInOut(Math.min(1, k*1.2));
      const s = pupSize(p), cs = carSize(c);
      const hx = lerp(p.x, c.x, e), hy = lerp(p.y - s.h*0.5, c.y - cs.h*0.5, e);
      ctx.save(); ctx.globalAlpha = k < 0.85 ? 0.9 : (1-k)*6; ctx.font = `${Math.round(H*0.11)}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('👆', hx, hy); ctx.restore();
    }
  }
  drawHud(P.placed, PUPS.length, null);
  if (!soundOn) drawMuteX(px(HOME.x), py(HOME.y));
  if (R){ drawResults(); drawParts(); }
}
function drawPupCar(c){
  const im = IMG[(c.filled ? 'full_' : 'empty_') + c.d.id], s = carSize(c);
  ctx.save(); ctx.globalAlpha = c.alpha;
  // shadow
  ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(c.x, c.y - s.h*0.03, s.w*0.46, s.h*0.07, 0, 0, 7); ctx.fill(); ctx.restore();
  ctx.translate(c.x, c.y); ctx.rotate(c.rot || 0);
  if (c.glow){ ctx.shadowColor = '#fff36b'; ctx.shadowBlur = 35; }
  let sq = 1;
  if (c.state === 'happy' && c.t < 0.3) sq = 1 + Math.sin(c.t/0.3*Math.PI)*0.12;
  ctx.drawImage(im, -s.w/2*sq, -s.h*(2-sq), s.w*sq, s.h*(2-sq));
  if (c.glow){ ctx.drawImage(im, -s.w/2, -s.h, s.w, s.h); }
  ctx.restore();
  if (c.err > 0){
    ctx.save(); ctx.globalAlpha = c.err*0.8; ctx.strokeStyle = '#ff3030'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(c.x, c.y - s.h*0.5, s.w*0.6, s.h*0.65, 0, 0, 7); ctx.stroke(); ctx.restore();
  }
}

const WORDS_PER_ROUND = 5;

  {k:'w_card_yellow', x:815,  txt:'#e5302d'},
  {k:'w_card_green',  x:1153, txt:'#ff4a2a'},

];
const CARD_Y = 1203, SLOT_Y = 822, FRAME_C = [1290, 350], FRAME_IN = [560, 370];
const WBOY = {x0:117, y0:712, x1:574, y1:1392};
const WLISTEN = {x:2465, y:105, r:78}, WHINT = {x:2268, y:105, r:62};
const PRAISE = ['Молодец!', 'Отлично!', 'Супер!', 'Умница!', 'Здорово!'];
let WG = null, wordsHints = true, recentWords = [];

function wordName(w){ return w.s.replace(/-/g, ''); }
function lowName(w){ const n = wordName(w).toLowerCase(); return n === 'давид' ? 'Давид' : n; }
function newWordsRound(round){
  let list;
  if (round === 0) list = FIRST_WORDS.slice();
  else {
    let pool = WORD_POOL.filter(w => !recentWords.includes(w.s));
    if (pool.length < WORDS_PER_ROUND) { recentWords = []; pool = WORD_POOL.slice(); }
    pool.sort(() => Math.random() - 0.5);
    list = pool.slice(0, WORDS_PER_ROUND).sort((a,b) => a.s.split('-').length - b.s.split('-').length);
    recentWords.push(...list.map(w => w.s)); if (recentWords.length > 30) recentWords = recentWords.slice(-30);
  }
  WG = {round, list, idx:0, solved:0, mistakes:0, phase:'play', t:0, slots:[], cards:[], boyT:9, word:null, picPop:0, wait:0};
  R = null;
  startWord();
}
function startWord(){
  const w = WG.list[WG.idx];
  const syl = w.s.split('-');
  WG.word = w; WG.phase = 'play'; WG.t = 0; WG.picPop = 0;
  const n = syl.length, size = n === 3 ? 240 : 262, step = n === 3 ? 300 : 345;
  WG.slots = syl.map((s, i) => ({exp:s, card:null, cx: 1290 + (i - (n-1)/2)*step, cy: SLOT_Y, size, glow:0}));
  // cards: needed syllables + distractors up to 4
  const texts = syl.slice();
  const all = [...new Set(WORD_POOL.concat(FIRST_WORDS).flatMap(x => x.s.split('-')))].filter(x => !syl.includes(x) && x.length <= 4);
  all.sort(() => Math.random() - 0.5);
  while (texts.length < 4) texts.push(all.pop());
  texts.sort(() => Math.random() - 0.5);
  WG.cards = texts.map((t, i) => ({text:t, col:CARD_COLORS[i], hx:CARD_COLORS[i].x, hy:CARD_Y, x:0, y:0, state:'home', t:0, sc:1, slot:null, pop:0}));
  for (const c of WG.cards){ c.x = px(c.hx); c.y = py(c.hy); }
  say((WG.idx === 0 && WG.round === 0 ? 'Собери слово! ' : '') + 'Это ' + lowName(w) + '!', 500);
}
function cardDims(c){ const im = IMG[c.col.k]; return {w: px(im.width), h: py(im.height)}; }
function slotRect(s){ return {x: px(s.cx - s.size/2), y: py(s.cy - s.size*0.48), w: px(s.size), h: py(s.size*0.96)}; }
function sylSay(t){ say(t.toLowerCase()); }
function speakWord(praise){
  const w = WG.word, syl = w.s.split('-');
  const parts = syl.length > 1 ? syl.map(x => x.toLowerCase()).join(', ') + '. ' : '';
  say(parts + lowName(w) + '!' + (praise ? ' ' + praise : ''));
}
function nextEmptySlot(){ return WG.slots.find(s => !s.card); }
function slotUnder(x, y){
  for (const s of WG.slots){ const r = slotRect(s);
    if (x > r.x - r.w*0.15 && x < r.x + r.w*1.15 && y > r.y - r.h*0.2 && y < r.y + r.h*1.2) return s; }
  return null;
}
function placeCard(c, s){
  s.card = c; c.slot = s; c.state = 'fly'; c.t = 0; c.fx = c.x; c.fy = c.y; s.glow = 1;
  SFX.dzin(); sylSay(c.text);
  const r = slotRect(s); burstStars(r.x + r.w/2, r.y + r.h/2, 10);
  if (WG.boyT > 1.2) WG.boyT = 1.2;   // David hops on each correct syllable

function oops(c){

function completeWord(){
  if (WG.phase !== 'play') return;

  for (let i=0;i<3;i++) setTimeout(() => burstStars(px(900 + Math.random()*800), py(250 + Math.random()*500), 22), i*280);

function wordsDown(x, y){
  if (R){ resultsTap(x, y); return; }

  if (Math.abs(x - px(FRAME_C[0])) < px(FRAME_IN[0]/2) && Math.abs(y - py(FRAME_C[1])) < py(FRAME_IN[1]/2)){ WG.picPop = 0.01; speakWord(); return; }
  // boy
  if (x > px(WBOY.x0) && x < px(WBOY.x1) && y > py(WBOY.y0) && y < py(WBOY.y1)){ WG.boyT = 0; SFX.jump(); say('Привет! Я Давид!'); return; }
  if (WG.phase !== 'play') return;
  for (const c of WG.cards){
    if (c.state !== 'home') continue;
    const d = cardDims(c);
    if (Math.abs(x - c.x) < d.w/2 && Math.abs(y - c.y) < d.h/2){
      c.state = 'drag'; c.dx = c.x - x; c.dy = c.y - y; c.sx = x; c.sy = y; c.moved = 0;
      SFX.tick(); sylSay(c.text); return;
    }
  }
}
function wordsMove(x, y){
  const c = WG && WG.cards.find(k => k.state === 'drag'); if (!c) return;
  c.moved = Math.max(c.moved, dist(x, y, c.sx, c.sy)); c.x = x + c.dx; c.y = y + c.dy;
  const s = slotUnder(c.x, c.y);
  for (const q of WG.slots) q.hover = (q === s && !q.card) ? 1 : 0;
}
function wordsUp(x, y){
  const c = WG && WG.cards.find(k => k.state === 'drag'); if (!c) return;
  for (const q of WG.slots) q.hover = 0;
  if (c.moved < 15){
    const s = nextEmptySlot();
    if (s && s.exp === c.text) placeCard(c, s);
    else { c.x = px(c.hx); c.y = py(c.hy); c.state = 'home'; c.pop = 0.01; }
    return;
  }
  const s = slotUnder(c.x, c.y);
  if (s && !s.card && s.exp === c.text) placeCard(c, s);
  else if (s && !s.card) oops(c);
  else { c.state = 'back'; c.t = 0; c.fx = c.x; c.fy = c.y; }
}

function updWords(dt){
  if (!WG) return;
  updResults(dt);
  WG.t += dt; WG.boyT += dt;
  if (WG.picPop > 0) WG.picPop += dt;
  for (const s of WG.slots) s.glow = Math.max(0, s.glow - dt*1.5);
  for (const c of WG.cards){
    c.t += dt; if (c.pop > 0) c.pop += dt;
    if (c.state === 'home'){ c.x = px(c.hx); c.y = py(c.hy); }
    else if (c.state === 'back'){ const k = Math.min(1, c.t/0.35); c.x = lerp(c.fx, px(c.hx), easeInOut(k)); c.y = lerp(c.fy, py(c.hy), easeInOut(k)); if (k >= 1){ c.state = 'home'; c.pop = 0.01; } }
    else if (c.state === 'shake'){ c.x = c.fx + Math.sin(c.t*45)*px(16)*(1 - c.t/0.45); if (c.t > 0.45){ c.state = 'back'; c.t = 0; c.fx = c.x; c.fy = c.y; } }
    else if (c.state === 'fly'){ const r = slotRect(c.slot), k = Math.min(1, c.t/0.22);
      c.x = lerp(c.fx, r.x + r.w/2, easeInOut(k)); c.y = lerp(c.fy, r.y + r.h/2, easeInOut(k)); if (k >= 1){ c.state = 'placed'; c.t = 0; } }
    else if (c.state === 'placed'){ const r = slotRect(c.slot); c.x = r.x + r.w/2; c.y = r.y + r.h/2; }
  }
  if (WG.phase === 'done' && WG.t > 3.6){
    WG.idx++;
    if (WG.idx >= WG.list.length){
      WG.phase = 'results';
      const m = WG.mistakes, stars = m <= 1 ? 3 : m <= 4 ? 2 : 1;
      const r = WG.round;
      R = {t:0, stars, shown:0, title:'Супер, Давид!', line:'Собрано слов: ' + WG.solved, again(){ newWordsRound(r + 1); }};
      SFX.win(); confetti(150); WG.boyT = 0;
      say('Ура! Ты собрал ' + WG.solved + ' слов! Молодец, Давид!', 400);
    } else startWord();
  }
}

    const k2 = Math.min(1, Math.max(0, WG.t - 0.2)/0.4);
    ctx.save(); ctx.globalAlpha = k2; ctx.translate(px(2050), py(640)); ctx.rotate(-0.08); ctx.scale(easeOutBack(k2), easeOutBack(k2));
    outlined(WG.praise || 'Молодец!', 0, 0, Math.round(py(120)), '#7dff6b', '#1f4a14'); ctx.restore();
  }
  if (WG.flash){
    const f = WG.flash; f.t += 1/60;
    if (f.t > 1) WG.flash = null;
    else { ctx.save(); ctx.globalAlpha = Math.min(1, (1 - f.t)*3); outlined(f.text, f.x, f.y - f.t*py(60), Math.round(py(95)), f.col, '#5a1d0e'); ctx.restore(); }
  }
  // hints toggle button
  const hx = px(WHINT.x), hy = py(WHINT.y), hr = Math.min(px(WHINT.r), py(WHINT.r)*1.1);
  ctx.save(); ctx.fillStyle = wordsHints ? '#ffd23f' : '#c9c2b6'; ctx.strokeStyle = '#fff'; ctx.lineWidth = hr*0.14;
  ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 7); ctx.fill(); ctx.shadowColor = 'transparent'; ctx.stroke();

  ctx.globalAlpha = wordsHints ? 1 : 0.45; ctx.fillText('💡', hx, hy + hr*0.05); ctx.restore();
  if (!wordsHints) drawMuteX(hx, hy);
  drawHud(WG.solved, WG.list.length, null);
  if (!soundOn) drawMuteX(px(HOME.x), py(HOME.y));
  if (R){ drawResults(); drawParts(); }
}
function drawWordsBoy(){

let DG = null;
const DSHEETS = {};
const hexRgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];

function dinoSheet(k){
  if (DSHEETS[k]) return DSHEETS[k];
  const li = IMG['dino_' + k + '_lab'], w = li.width, h = li.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d'); cx.drawImage(li, 0, 0);
  const d = cx.getImageData(0, 0, w, h).data;
  const lab = new Uint16Array(w*h); let maxL = 0;
  for (let i=0, j=0; i<lab.length; i++, j+=4){ const v = d[j] | (d[j+1] << 8); lab[i] = v; if (v > maxL) maxL = v; }
  const cnt = new Int32Array(maxL + 2);
  for (let i=0;i<lab.length;i++) cnt[lab[i]+1]++;
  for (let i=1;i<cnt.length;i++) cnt[i] += cnt[i-1];
  const start = cnt.slice(); const idx = new Int32Array(lab.length); const pos = cnt.slice();
  for (let i=0;i<lab.length;i++) idx[pos[lab[i]]++] = i;
  const area = new Int32Array(maxL + 1); for (let l=0;l<=maxL;l++) area[l] = start[l+1] - start[l];
  const big = []; for (let l=1;l<=maxL;l++) if (area[l] >= 250) big.push(l);
  return DSHEETS[k] = {w, h, lab, idx, start, area, maxL, big};
}
function newDino(){ DG = {i:0, done:0, tool:0, eraser:false, phase:'play', t:0, boyT:9, pick:0}; R = null; loadDino(); }
function loadDino(){
  const def = DINOS[DG.i], sh = dinoSheet(def.k);
  const cc = document.createElement('canvas'); cc.width = sh.w; cc.height = sh.h;
  const cctx = cc.getContext('2d');
  DG.def = def; DG.sh = sh; DG.cc = cc; DG.cctx = cctx; DG.cdata = cctx.createImageData(sh.w, sh.h);
  DG.colors = new Int16Array(sh.maxL + 1).fill(-1);
  DG.phase = 'enter'; DG.t = 0; DG.sprite = null; DG.flashes = [];
  say(def.name + '! Давай раскрасим!', 500);
}
function paperRect(){
  const sh = DG.sh, pw = px(PAPER.x1 - PAPER.x0), ph = py(PAPER.y1 - PAPER.y0);
  const sc = Math.min(pw*0.9/sh.w, ph*0.86/sh.h);
  const w = sh.w*sc, h = sh.h*sc;
  return {x: px(PAPER.x0) + (pw - w)/2, y: py(PAPER.y0) + (ph - h)/2 + ph*0.02, w, h, sc};
}
function regionAt(x, y){
  const r = paperRect(), sh = DG.sh;
  const u = Math.floor((x - r.x)/r.sc), v = Math.floor((y - r.y)/r.sc);
  const rad = Math.ceil(px(14)/r.sc);
  let best = 0, bd = 1e9;
  for (let dy=-rad; dy<=rad; dy+=1) for (let dx=-rad; dx<=rad; dx+=1){
    const uu = u+dx, vv = v+dy; if (uu<0||vv<0||uu>=sh.w||vv>=sh.h) continue;
    const l = sh.lab[vv*sh.w + uu]; if (!l) continue;
    const d = dx*dx + dy*dy; if (d < bd){ bd = d; best = l; if (d === 0) return l; }
  }
  return best;
}
function paintRegion(l, colorIdx){
  const sh = DG.sh, d = DG.cdata.data;
  const rgb = colorIdx >= 0 ? hexRgb(PAINTS[colorIdx].c) : null;
  for (let p = sh.start[l]; p < sh.start[l+1]; p++){
    const i = sh.idx[p]*4;
    if (rgb){ d[i] = rgb[0]; d[i+1] = rgb[1]; d[i+2] = rgb[2]; d[i+3] = 255; } else d[i+3] = 0;
  }
  DG.colors[l] = colorIdx;
  DG.cctx.putImageData(DG.cdata, 0, 0);
}
function coloredShare(){ const b = DG.sh.big; if (!b.length) return 1; let n = 0; for (const l of b) if (DG.colors[l] >= 0) n++; return n / b.length; }
function anyColored(){ for (let l=1; l<DG.colors.length; l++) if (DG.colors[l] >= 0) return true; return false; }
function hitD(o, x, y){ return dist(x, y, px(o.x), py(o.y)) < Math.min(px(o.r), py(o.r)*1.2); }

function dinoDown(x, y){
  if (R){ resultsTap(x, y); return; }
  if (dist(x,y,px(HOME.x),py(HOME.y)) < Math.min(px(HOME.r), py(HOME.r))*1.3){ SFX.click(); changeScene('menu'); return; }
  if (hitD(DBTN.sound, x, y)){ setSound(!soundOn); SFX.click(); return; }
  if (x > px(DBOY.x0) && x < px(DBOY.x1) && y > py(DBOY.y0) && y < py(DBOY.y1)){ DG.boyT = 0; SFX.jump(); say('Раскрашивай! У тебя получится!'); return; }
  if (DG.phase !== 'play') return;
  for (let i=0;i<PAINTS.length;i++){
    if (dist(x, y, px(PAINTS[i].x), py(PAINTS[i].y)) < Math.min(px(78), py(78)*1.2)){
      DG.tool = i; DG.eraser = false; DG.pick = 0; SFX.bulk(); say(PAINTS[i].n); return;
    }
  }
  if (hitD(DBTN.eraser, x, y)){ DG.eraser = true; DG.pick = 0; SFX.erase(); say('Ластик'); return; }
  if (hitD(DBTN.trash, x, y)){
    if (!anyColored()) return;
    for (let l=1; l<DG.colors.length; l++) DG.colors[l] = -1;
    DG.cdata = DG.cctx.createImageData(DG.sh.w, DG.sh.h); DG.cctx.clearRect(0, 0, DG.sh.w, DG.sh.h);
    DG.shake = 0.5; SFX.trash(); say('Начнём сначала!'); return;
  }
  if (hitD(DBTN.done, x, y)){
    if (!anyColored()){ SFX.oops(); say('Сначала раскрась динозавра!'); return; }
    finishDino(); return;
  }
  const r = paperRect();
  if (x > r.x - px(20) && x < r.x + r.w + px(20) && y > r.y - py(20) && y < r.y + r.h + py(20)){
    const l = regionAt(x, y); if (!l) return;
    const col = DG.eraser ? -1 : DG.tool;

}
function finishDino(){
  DG.phase = 'finish'; DG.t = 0; DG.boyT = 0; DG.autoAsked = false;
  // build the living sprite: colors (unpainted interior = white) + lines
  const sh = DG.sh, c = document.createElement('canvas'); c.width = sh.w; c.height = sh.h;
  const x = c.getContext('2d'), id = x.createImageData(sh.w, sh.h), d = id.data, src = DG.cdata.data;
  for (let i=0;i<sh.lab.length;i++){
    const j = i*4;
    if (sh.lab[i]){ if (src[j+3]){ d[j]=src[j]; d[j+1]=src[j+1]; d[j+2]=src[j+2]; } else { d[j]=255; d[j+1]=255; d[j+2]=255; } d[j+3]=255; }
  }

  DG.sprite = c;
  const r = paperRect();

function updDino(dt){
  if (!DG) return;
  updResults(dt);
  DG.t += dt; DG.boyT += dt; DG.pick += dt;
  if (DG.shake) DG.shake = Math.max(0, DG.shake - dt);
  DG.flashes = DG.flashes.filter(f => (f.t += dt) < 0.45);
  if (DG.phase === 'enter' && DG.t > 0.5){ DG.phase = 'play'; DG.t = 0; }
  if (DG.phase === 'finish'){
    const t = DG.t, mv = DG.def.move;
    if (t > 1.7 && DG.def.left && !DG.turned){ DG.turned = true; DG.turnT = 0; }
    if (DG.turned && DG.flip > -1){ DG.turnT += dt; DG.flip = Math.max(-1, 1 - DG.turnT*6); }
    if (t > 2.0){
      const sp = W*0.33*Math.min(1, (t-2.0)/0.5);
      DG.sx += sp*dt;
      if (mv === 'fly') DG.sy -= W*0.12*dt*Math.min(1, (t-2)/0.5);
      if (Math.random() < 0.35 && mv !== 'fly') addPart({x:DG.sx - DG.sw*0.3, y:DG.sy, vx:-40, vy:-30, life:0.6, r:6 + Math.random()*6, color: mv === 'swim' ? 'rgba(160,220,255,0.8)' : 'rgba(170,150,110,0.6)', kind:'puff'});

        } else { DG.i++; loadDino(); }

}

function drawDinoLayer(){

function drawDino(){

  }
  // brush tip with current color
  const tipC = DG.eraser ? '#ffffff' : PAINTS[DG.tool].c;
  ctx.save(); ctx.translate(px(2152), py(790)); ctx.rotate(-0.95);
  ctx.fillStyle = tipC; ctx.strokeStyle = 'rgba(40,20,10,0.8)'; ctx.lineWidth = py(5);
  ctx.beginPath(); ctx.ellipse(0, 0, px(62), py(40), 0, 0, 7); ctx.fill(); ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(-px(15), -py(14), px(26), py(9), 0, 0, 7); ctx.fill();

    ctx.beginPath(); ctx.arc(px(o.x), py(o.y), Math.min(px(o.r), py(o.r))*(1.15 + Math.sin(T*6)*0.04), 0, 7); ctx.stroke(); ctx.restore(); }
  // done button pulse when mostly colored
  if (DG.phase === 'play' && anyColored()){ const o = DBTN.done; ctx.save(); ctx.globalAlpha = 0.5 + Math.sin(T*5)*0.3; ctx.strokeStyle = '#7dff6b'; ctx.lineWidth = py(9);

    else if (mv === 'fly'){ sy = 1 + Math.sin(t*14)*0.12; rot = -0.12; }
    else if (mv === 'swim'){ jy = Math.sin(t*6)*py(14); rot = Math.sin(t*6)*0.06; }
    else { jy = -Math.abs(Math.sin(t*9))*py(18); rot = Math.sin(t*9)*0.05; }
    const grow = Math.min(1, t/0.3);
    ctx.save(); ctx.translate(DG.sx, DG.sy + jy); ctx.rotate(rot); ctx.scale(DG.flip*sx*(1 + 0.08*grow), sy*(1 + 0.08*grow));
    ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 10;
    ctx.drawImage(DG.sprite, -DG.sw/2, -DG.shh, DG.sw, DG.shh); ctx.restore();
    if (t > 0.4 && t < 1.8){ ctx.save(); ctx.globalAlpha = Math.min(1, (1.8 - t)*3); ctx.translate(DG.sx + DG.sw*0.35*DG.flip, DG.sy - DG.shh*1.05);
      const k = Math.min(1, (t - 0.4)/0.25); ctx.scale(easeOutBack(k), easeOutBack(k)); outlined('Р-р-р!', 0, 0, Math.round(py(90)), '#ff8a00', '#5a1d0e'); ctx.restore(); }

  {h:1200, e:'🚀', say:'Вау! Башня до самого космоса!'},
];
const SLAB_TOP = 880, GROUND_TOP = 985;
let BG = null;

function bScale(){ return H / 1000 * BG.zoom; }
function w2s(x, y){ const s = bScale(); return [(x - BG.camX)*s, (y - BG.camY)*s]; }
function s2w(x, y){ const s = bScale(); return [x/s + BG.camX, y/s + BG.camY]; }
function viewW0(){ return 1000 * W / H; }

function newBuild(){
  if (!window.Matter){ toast('Ошибка', 'нет физики', '#ff5050'); return; }
  const {Engine, Bodies, Composite, Events} = Matter;
  const engine = Engine.create({enableSleeping:true});
  engine.positionIterations = 14; engine.velocityIterations = 12;
  const TX = viewW0()*0.56;
  const slab = Bodies.rectangle(TX, SLAB_TOP + 40, 540, 80, {isStatic:true, friction:1, label:'slab'});
  const ground = Bodies.rectangle(TX, GROUND_TOP + 200, 20000, 400, {isStatic:true, friction:1, label:'ground'});
  Composite.add(engine.world, [slab, ground]);
  BG = {engine, TX, blocks:[], held:null, mode:'build', camX:0, camY:0, zoom:1, tcamY:0, tzoom:1,
        phase:0, trolleyX:TX, reload:0, dropT:0, falling:null, milesHit:0, stars:(BG ? BG.stars : 0),
        boy:'idle', boyT:9, acc:0, ball:null, balls:[], booms:[], victory:false, newBtn:false, demolT:0, lastThud:0, lastCrash:0,
        lastTopX:TX, wobbleT:0, knocked:0, topY:SLAB_TOP, maxH:0, swipeHint:true};
  Events.on(engine, 'collisionStart', onBuildCollide);
  nextBlock(true);
  say('Стройка! Нажимай на экран, и кран отпустит блок!', 600);
}
function pickType(){
  const n = BG.blocks.length;
  if (n < 2) return BTYPES[Math.floor(Math.random()*4)];
  const r = Math.random();
  // the roof is the crown of a tall tower: once per tower
  if (!BG.roofGiven && SLAB_TOP - BG.topY >= 520 && Math.random() < 0.35){ BG.roofGiven = true; return BTYPES[6]; }
  if (r < 0.3) return BTYPES[4];
  if (r < 0.42) return BTYPES[5];
  return BTYPES[Math.floor(Math.random()*4)];
}
function nextBlock(first){
  const t = pickType(), im = IMG[t.k], dh = t.dw * im.height / im.width;
  BG.held = {t, dw:t.dw, dh}; BG.reload = first ? 0.6 : 0;
}
function bodyDims(b){ // size of the physical shape
  const t = b.t;
  if (t.tri) return null;
  return {w: b.dw*(t.f[2]-t.f[0]), h: b.dh*(t.f[3]-t.f[1])};
}
function makeBody(h, x, y){
  const {Bodies} = Matter, t = h.t;
  const opt = {friction:1, frictionStatic:3, restitution:0, density:0.003, frictionAir:0.02, slop:0.01, label:'block', chamfer:{radius:2}};
  let body, cx, cy;
  if (t.tri){
    const vs = t.tri.map(([u,v]) => ({x:u*h.dw, y:v*h.dh}));
    cx = (vs[0].x + vs[1].x + vs[2].x)/3; cy = (vs[0].y + vs[1].y + vs[2].y)/3;
    body = Bodies.fromVertices(x, y, [vs], opt);
    Matter.Body.setPosition(body, {x, y});
  } else {
    const d = {w: h.dw*(t.f[2]-t.f[0]), h: h.dh*(t.f[3]-t.f[1])};
    body = Bodies.rectangle(x, y, d.w, d.h, opt);
    cx = h.dw*(t.f[0]+t.f[2])/2; cy = h.dh*(t.f[1]+t.f[3])/2;
  }
  return {body, t, dw:h.dw, dh:h.dh, ox:cx, oy:cy, settled:false, onTower:false, knocked:false, home:null};
}
// where the held block hangs (world coords)
function heldPos(){
  const hookBottomView = 400;
  const h = BG.held, t = h.t;
  const top = t.tri ? h.dh*0.06 : h.dh*t.f[1];
  const cy = t.tri ? h.dh*(2.06/3) : h.dh*(t.f[1]+t.f[3])/2;
  return {x: BG.trolleyX, y: BG.camY + hookBottomView/BG.zoom + (cy - top) + 6};
}

function buildDown(x, y){
  if (!BG) return;
  if (dist(x,y,px(HOME.x),py(HOME.y)) < Math.min(px(HOME.r), py(HOME.r))*1.3){ SFX.click(); changeScene('menu'); return; }
  const sb = buildSoundBtn(); if (dist(x, y, sb.x, sb.y) < sb.r*1.2){ setSound(!soundOn); SFX.click(); return; }
  const db = demolBtn();
  if (BG.mode === 'build' && dist(x, y, db.x, db.y) < db.r*1.15){
    if (!BG.blocks.length){ SFX.oops(); say('Сначала построй башню!'); return; }
    startDemolish(); return;
  }
  if (BG.newBtn){ const nb = newBtnRect(); if (x > nb.x && x < nb.x + nb.w && y > nb.y && y < nb.y + nb.h){ SFX.click(); resetTower(); return; } }
  if (x < W*0.2 && y > H*0.62){ BG.boy = 'happy'; BG.boyT = 0; SFX.jump(); say('Я строитель!'); return; }
  if (BG.mode === 'build'){
    if (BG.held && BG.reload >= 0.6) dropBlock();
  } else if (BG.mode === 'demolish'){
    const [wx, wy] = s2w(x, y);
    const ball = Matter.Bodies.circle(wx, wy, 90, {density:0.03, frictionAir:0.005, restitution:0.35, friction:0.2, label:'ball'});
    Matter.Composite.add(BG.engine.world, ball);
    BG.ball = {body:ball, tx:wx, ty:wy, anchorX: wx, life:0, held:true};
    BG.balls.push(BG.ball); BG.swipeHint = false; SFX.swoosh();
  }
}
function buildMove(x, y){ if (BG && BG.ball && BG.ball.held){ const [wx, wy] = s2w(x, y); BG.ball.tx = wx; BG.ball.ty = wy; } }
function buildUp(){ if (BG && BG.ball){ BG.ball.held = false; BG.ball = null; } }

function dropBlock(){
  const p = heldPos(), b = makeBody(BG.held, p.x, p.y);
  Matter.Composite.add(BG.engine.world, b.body);
  BG.blocks.push(b); BG.falling = b; BG.dropT = 0; BG.held = null;
  SFX.whistle();
}
function startDemolish(){
  BG.mode = 'demolish'; BG.held = null; BG.demolT = 0; BG.swipeHint = true; BG.knockBase = BG.blocks.length;
  for (const b of BG.blocks) b.home = {x:b.body.position.x, y:b.body.position.y, a:b.body.angle};
  SFX.horn(); say('Проведи пальцем по башне! Бум!', 200);
}
function resetTower(){
  const st = BG.stars; Matter.Engine.clear(BG.engine); BG = null; newBuild(); BG.stars = st;
}
function onBuildCollide(ev){
  if (!BG) return;
  const now = performance.now();
  for (const p of ev.pairs){
    const a = p.bodyA, b = p.bodyB;
    const ball = a.label === 'ball' ? a : b.label === 'ball' ? b : null;
    const other = ball === a ? b : a;
    const sp = (a.speed || 0) + (b.speed || 0);
    const sup = p.collision && p.collision.supports && p.collision.supports[0];
    if (ball && other.label === 'block'){
      if (now - BG.lastCrash > 90){ BG.lastCrash = now; SFX.crash(Math.min(1, sp/30)); }
      if (sup){ BG.booms.push({x:sup.x, y:sup.y, t:0});
        const [sx, sy] = w2s(sup.x, sup.y); burstStars(sx, sy, 8);
        for (let i=0;i<5;i++) addPart({x:sx, y:sy, vx:(Math.random()-0.5)*300, vy:-Math.random()*200, g:200, life:0.9, r:12+Math.random()*14, color:'rgba(200,195,185,0.75)', kind:'puff'}); }
      BG.boy = 'happy'; BG.boyT = 0;
    } else if (a.label === 'block' || b.label === 'block'){
      if (sp > 3 && now - BG.lastThud > 70){ BG.lastThud = now; SFX.thud2(Math.min(1, sp/14)); }
      if (sp > 4 && sup && BG.mode === 'build'){ const [sx, sy] = w2s(sup.x, sup.y);
        for (let i=0;i<4;i++) addPart({x:sx, y:sy, vx:(Math.random()-0.5)*160, vy:-20-Math.random()*60, g:60, life:0.7, r:8+Math.random()*8, color:'rgba(215,205,185,0.7)', kind:'puff'}); }
    }
  }
}
function towerTop(){
  let top = SLAB_TOP, tx = BG.TX;
  for (const b of BG.blocks){
    const bd = b.body;
    if (bd === (BG.falling && BG.falling.body)) continue;
    if (Math.abs(bd.position.x - BG.TX) > 420 || bd.position.y > SLAB_TOP + 10) continue;
    if (bd.speed > 1.5) continue;
    if (bd.bounds.min.y < top){ top = bd.bounds.min.y; tx = bd.position.x; }
  }
  return {top, tx};
}

function updBuild(dt){
  if (!BG) return;
  BG.boyT += dt; BG.reload += dt;
  if (BG.boyT > 1.6 && BG.boy !== 'idle') BG.boy = 'idle';
  // physics
  BG.acc += dt; let steps = 0;
  while (BG.acc >= 1/60 && steps < 4){
    if (BG.ball && BG.ball.held){
      const bb = BG.ball.body, vx = clamp((BG.ball.tx - bb.position.x)*0.35, -55, 55), vy = clamp((BG.ball.ty - bb.position.y)*0.35, -55, 55);
      Matter.Body.setVelocity(bb, {x:vx, y:vy});
    }
    Matter.Engine.update(BG.engine, 1000/120); Matter.Engine.update(BG.engine, 1000/120); BG.acc -= 1/60; steps++;
  }
  if (steps === 4) BG.acc = 0;
  // crane movement
  if (BG.mode === 'build'){
    BG.phase += dt * 1.25;
    const A = Math.min(330, viewW0()*0.3);
    BG.trolleyX = BG.TX + Math.sin(BG.phase) * A;
  } else BG.trolleyX += (BG.TX + viewW0()*1.2 - BG.trolleyX) * Math.min(1, dt*1.5);
  // falling block settles
  if (BG.falling){
    BG.dropT += dt;
    const fb = BG.falling.body;
    if ((BG.dropT > 0.6 && fb.speed < 0.3) || BG.dropT > 3){
      const f = BG.falling; BG.falling = null; f.settled = true;
      const onTower = Math.abs(fb.position.x - BG.TX) < 420 && fb.position.y < SLAB_TOP + 5;
      f.onTower = onTower;
      if (!onTower){ BG.boy = 'scared'; BG.boyT = 0; SFX.oops(); say('Ой! Мимо!'); }
      else if (f.t.tri){ BG.boy = 'happy'; BG.boyT = 0; SFX.bell(); confetti(40); BG.roofDone = true; say('Красивая крыша! Башня готова! Нажми СНЕСТИ!', 200); }
      else if (Math.abs(fb.position.x - BG.lastTopX) < 45){ BG.boy = 'happy'; BG.boyT = 0; SFX.dzin(); burstStars(...w2s(fb.position.x, fb.bounds.min.y), 10); }
      setTimeout(() => { if (BG && BG.mode === 'build' && !BG.held && !BG.roofDone) nextBlock(); }, 450);
    }
  }
  // tower measurements
  const tt = towerTop(); BG.topY = tt.top; if (!BG.falling) BG.lastTopX = tt.tx;
  const hgt = SLAB_TOP - tt.top;
  BG.maxH = Math.max(BG.maxH, hgt);
  while (BG.milesHit < MILES.length && hgt >= MILES[BG.milesHit].h && BG.mode === 'build'){
    const m = MILES[BG.milesHit]; BG.milesHit++; BG.stars++;
    SFX.bell(); confetti(50); BG.boy = 'happy'; BG.boyT = 0; say(m.say, 300);
    toast(m.e + ' Ура!', '', '#ffe14f');
  }
  // wobble / falling off
  BG.wobbleT -= dt;
  if (BG.mode === 'build' && BG.wobbleT <= 0){
    for (const b of BG.blocks){
      if (!b.settled || !b.onTower) continue;
      const bd = b.body;
      if (bd.position.y > SLAB_TOP + 30 || bd.angularSpeed > 0.05 || (bd.speed > 3)){
        BG.boy = 'scared'; BG.boyT = 0; BG.wobbleT = 2.5; SFX.uhoh(); say('Ой-ой-ой!');
        if (bd.position.y > SLAB_TOP + 30) b.onTower = false;
        break;
      }
    }
  }
  // demolition progress
  if (BG.mode === 'demolish'){
    BG.demolT += dt;
    for (const b of BG.blocks){
      if (b.knocked || !b.home) continue;
      const bd = b.body;
      if (Math.hypot(bd.position.x - b.home.x, bd.position.y - b.home.y) > 70 || Math.abs(bd.angle - b.home.a) > 0.6){
        b.knocked = true; BG.knocked++; BG.stars++;
        const [sx, sy] = w2s(bd.position.x, bd.position.y); burstStars(sx, sy, 6, '#ffd23f');
      }
    }
    if (!BG.victory && BG.knocked >= Math.max(1, Math.ceil(BG.knockBase*0.7))){
      BG.victory = true; SFX.win(); setTimeout(SFX.clap, 300); confetti(140); BG.boy = 'happy'; BG.boyT = -1.5;
      say('Бум! Вот это да! Башня разрушена! Ура!', 300);
      setTimeout(() => { if (BG) BG.newBtn = true; }, 3000);
    }
    if (!BG.newBtn && !BG.victory && BG.demolT > 12) BG.newBtn = true;
  }
  // balls lifetime, cleanup
  for (const bl of BG.balls){ if (!bl.held) bl.life += dt; }
  BG.balls = BG.balls.filter(bl => { const keep = bl.held || (bl.life < 3 && bl.body.position.y < 3000); if (!keep) Matter.Composite.remove(BG.engine.world, bl.body); return keep; });
  BG.blocks = BG.blocks.filter(b => { const p = b.body.position, keep = p.y < 4000 && Math.abs(p.x - BG.TX) < 6000; if (!keep) Matter.Composite.remove(BG.engine.world, b.body); return keep; });
  BG.booms = BG.booms.filter(o => (o.t += dt) < 0.35);
  // camera
  if (BG.mode === 'build'){
    BG.tzoom = 1; BG.tcamY = Math.min(0, BG.topY - 620); BG.tcamX = 0;
  } else {
    const top = Math.min(BG.topY, ...BG.blocks.map(b => b.home ? b.home.y - 150 : 1e9));
    const need = 1000 - (top - 180);
    BG.tzoom = Math.min(1, 1000/need); BG.tcamY = 1000 - 1000/BG.tzoom;
    BG.tcamX = BG.TX - 0.56*viewW0()/BG.tzoom;
  }
  const k = Math.min(1, dt*2.5);
  BG.zoom += (BG.tzoom - BG.zoom)*k; BG.camY += (BG.tcamY - BG.camY)*k; BG.camX += ((BG.tcamX || 0) - BG.camX)*k;
}

// ---- drawing ----
function drawBuildBg(){
  const alt = Math.max(0, -BG.camY);
  const k = clamp((alt - 500)/1500, 0, 1);
  const mix = (a, b) => { const A = hexRgb(a), B = hexRgb(b); return `rgb(${Math.round(lerp(A[0],B[0],k))},${Math.round(lerp(A[1],B[1],k))},${Math.round(lerp(A[2],B[2],k))})`; };
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix('#6cc8ff', '#0b1240')); g.addColorStop(1, mix('#d4f3ff', '#2e3c8f'));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // stars in space
  if (k > 0.2){
    ctx.save(); ctx.globalAlpha = (k - 0.2)/0.8; ctx.fillStyle = '#fff';
    for (let i=0;i<70;i++){ const sx = (i*137.5 % 1)*W || ((i*977) % W), sy = ((i*613 + BG.camY*0.1) % H + H) % H, r = (i % 3) + 1;
      ctx.globalAlpha = (k - 0.2)/0.8 * (0.5 + 0.5*Math.sin(T*2 + i)); ctx.beginPath(); ctx.arc((i*97) % W, sy, r, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  const s = bScale();
  // sun
  { const [sx, sy] = w2s(BG.camX + viewW0()*0.82/BG.zoom, BG.camY*0.3 + 140); ctx.save(); ctx.fillStyle = '#ffe25a'; ctx.shadowColor = '#fff3a0'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(sx, sy, 70*s, 0, 7); ctx.fill(); ctx.restore(); }
  // clouds (world)
  const clouds = [[200,250,1],[900,120,1.2],[1500,330,0.9],[400,-300,1.3],[1300,-600,1.1],[200,-1000,1.4],[1100,-1400,1.2],[600,-1900,1.0]];
  for (const [cx, cy, sc] of clouds){
    const [x, y] = w2s(cx + Math.sin(T*0.2 + cx)*40 + BG.camX*0.3, cy);
    if (y < -200 || y > H + 100) continue;
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.92)'; const r = 55*s*sc;
    for (const [dx, dy, rr] of [[0,0,1],[1.1,-0.35,1.2],[2.2,0,1],[1.1,0.25,1.1]]){ ctx.beginPath(); ctx.arc(x + dx*r, y + dy*r, rr*r, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  // hills + toy town
  const hill = (base, amp, freq, col, par) => {
    ctx.fillStyle = col; ctx.beginPath();
    const [, y0] = w2s(0, base); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20){ const wx = x/s + BG.camX*par; ctx.lineTo(x, y0 + Math.sin(wx*freq)*amp*s + Math.sin(wx*freq*2.3)*amp*0.3*s); }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  };
  hill(760, 50, 0.004, '#8fd46b', 0.5);
  // town
  const houses = [[150,'#ff8a65'],[330,'#ffd54f'],[1250,'#4fc3f7'],[1450,'#ba68c8'],[1650,'#ff8a65'],[1850,'#81c784']];
  for (const [hx, col] of houses){
    const [x, y] = w2s(hx + BG.camX*0.5, 770); const w = 90*s, h = 80*s;
    ctx.fillStyle = col; ctx.fillRect(x, y - h, w, h);
    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.moveTo(x - 10*s, y - h); ctx.lineTo(x + w/2, y - h - 50*s); ctx.lineTo(x + w + 10*s, y - h); ctx.fill();
    ctx.fillStyle = '#fff8c4'; ctx.fillRect(x + 18*s, y - h + 20*s, 22*s, 22*s); ctx.fillRect(x + 52*s, y - h + 20*s, 22*s, 22*s);
  }
  hill(860, 40, 0.0055, '#6cc04a', 0.75);
  // ground
  const [, gy] = w2s(0, GROUND_TOP);
  ctx.fillStyle = '#5fb33f'; ctx.fillRect(0, gy, W, H - gy + 2);
  ctx.fillStyle = '#4e9a33'; ctx.fillRect(0, gy, W, 10*s);
}
function drawRuler(){
  const s = bScale();
  const x = Math.max(px(620), W*0.24);
  const [, y0] = w2s(0, SLAB_TOP); let [, y1] = w2s(0, SLAB_TOP - 1300); y1 = Math.max(y1, 160*H/1000);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 150*H/1000, W, H); ctx.clip();
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 3;
  roundRect(x - 9*s, y1, 18*s, y0 - y1, 9*s); ctx.fill(); ctx.stroke();
  for (let h = 100; h <= 1300; h += 100){ const [, y] = w2s(0, SLAB_TOP - h); ctx.fillStyle = '#7a4a22'; ctx.fillRect(x - 16*s, y - 2, 32*s, 4); }
  // current height marker
  const [, cy] = w2s(0, BG.topY);
  ctx.fillStyle = '#ff5a3c'; ctx.beginPath(); ctx.moveTo(x + 14*s, cy); ctx.lineTo(x + 44*s, cy - 18*s); ctx.lineTo(x + 44*s, cy + 18*s); ctx.closePath(); ctx.fill();
  for (let i=0;i<MILES.length;i++){
    const m = MILES[i], [, y] = w2s(0, SLAB_TOP - m.h), got = i < BG.milesHit;
    if (got){ ctx.save(); ctx.shadowColor = '#fff36b'; ctx.shadowBlur = 25; ctx.fillStyle = 'rgba(255,240,120,0.85)'; ctx.beginPath(); ctx.arc(x - 60*s, y, 48*s, 0, 7); ctx.fill(); ctx.restore(); }
    else { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(x - 60*s, y, 44*s, 0, 7); ctx.fill(); }
    ctx.font = `${Math.round(62*s)}px "Noto Color Emoji","Apple Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = got ? 1 : 0.75; ctx.fillText(m.e, x - 60*s, y + 3*s); ctx.globalAlpha = 1;
    ctx.strokeStyle = got ? '#ffd23f' : 'rgba(255,255,255,0.8)'; ctx.setLineDash([10*s, 8*s]); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 260*s, y); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore(); ctx.restore();
}
function drawBlockSprite(b, x, y, ang, alpha=1){

  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(ang);

function drawCrane(){
  const s = bScale(), z = BG.zoom;
  const beamY = 120*H/1000;               // screen-fixed beam
  // mast on the right
  const mx = W - 110*H/1000;
  ctx.save(); ctx.strokeStyle = '#e0a800'; ctx.lineWidth = 6*H/1000; ctx.fillStyle = '#ffc61a';
  const mw = 60*H/1000;
  ctx.fillRect(mx - mw/2, beamY, 8*H/1000, H); ctx.fillRect(mx + mw/2 - 8*H/1000, beamY, 8*H/1000, H);
  for (let y = beamY; y < H; y += mw){ ctx.beginPath(); ctx.moveTo(mx - mw/2, y); ctx.lineTo(mx + mw/2, y + mw); ctx.moveTo(mx + mw/2, y); ctx.lineTo(mx - mw/2, y + mw); ctx.stroke(); }
  // beam
  const bh = 46*H/1000;
  ctx.fillStyle = '#ffc61a'; ctx.fillRect(0, beamY - bh/2, W, 8*H/1000); ctx.fillRect(0, beamY + bh/2 - 8*H/1000, W, 8*H/1000);
  for (let x = 0; x < W; x += bh){ ctx.beginPath(); ctx.moveTo(x, beamY - bh/2); ctx.lineTo(x + bh, beamY + bh/2); ctx.moveTo(x + bh, beamY - bh/2); ctx.lineTo(x, beamY + bh/2); ctx.stroke(); }
  ctx.fillStyle = '#ff6b2c'; ctx.fillRect(mx - 70*H/1000, beamY - 70*H/1000, 140*H/1000, 50*H/1000);
  ctx.restore();
  // trolley + cable + hook (follows trolleyX in world x)
  const [tx] = w2s(BG.trolleyX, 0);
  const tim = IMG.c_trolley, tw = 200*H/1000, th = tw*tim.height/tim.width;
  ctx.drawImage(tim, tx - tw/2, beamY - th*0.55, tw, th);
  const him = IMG.c_hook, hw = 120*H/1000, hh = hw*him.height/him.width;
  const lift = BG.held ? (1 - Math.min(1, BG.reload/0.6))*60*H/1000 : 50*H/1000;
  const hookTop = 190*H/1000 - lift;
  const sway = Math.cos(BG.phase)*0.06*(BG.mode === 'build' ? 1 : 0);
  ctx.save(); ctx.translate(tx, beamY); ctx.rotate(-sway);
  ctx.strokeStyle = '#444'; ctx.lineWidth = 4*H/1000; ctx.beginPath(); ctx.moveTo(-8*H/1000, 0); ctx.lineTo(-8*H/1000, hookTop - beamY + 10); ctx.moveTo(8*H/1000, 0); ctx.lineTo(8*H/1000, hookTop - beamY + 10); ctx.stroke();
  ctx.drawImage(him, -hw/2, hookTop - beamY, hw, hh);
  ctx.restore();
  // held block (swings with the hook)
  if (BG.held && BG.mode === 'build'){
    const h = BG.held, p = heldPos(), [bx, by] = w2s(p.x, p.y), k = Math.min(1, BG.reload/0.6);
    const fake = {t:h.t, dw:h.dw, dh:h.dh, ox: h.t.tri ? h.dw*(0+0.68+0.37)/3 : h.dw*(h.t.f[0]+h.t.f[2])/2, oy: h.t.tri ? h.dh*(2.06/3) : h.dh*(h.t.f[1]+h.t.f[3])/2};
    ctx.save(); ctx.translate(tx, beamY); ctx.rotate(-sway); ctx.translate(-tx, -beamY);
    drawBlockSprite(fake, bx, by, 0, k); ctx.restore();
  }
}
function buildSoundBtn(){ return {x: W - 70*H/1000, y: 230*H/1000, r: 52*H/1000}; }
function demolBtn(){ return {x: W - 280*H/1000, y: H - 140*H/1000, r: 105*H/1000}; }
function newBtnRect(){ const w = Math.min(W*0.5, 560), h = Math.min(H*0.16, 100); return {x: W/2 - w/2, y: H*0.42 - h/2, w, h}; }
function drawBuild(){
  drawBuildBg();
  const s = bScale();
  // slab
  { const im = IMG.c_slab, dw = 640, dh = dw*im.height/im.width; const [x, y] = w2s(BG.TX, SLAB_TOP); ctx.drawImage(im, x - dw*s/2, y - dh*0.36*s, dw*s, dh*s); }
  drawRuler();
  // blocks
  for (const b of BG.blocks){ const p = b.body.position; const [x, y] = w2s(p.x, p.y); drawBlockSprite(b, x, y, b.body.angle); }
  // booms
  for (const o of BG.booms){ const [x, y] = w2s(o.x, o.y), k = o.t/0.35, im = IMG.f_boom, w = 230*s*(0.6 + k*0.6);
    ctx.save(); ctx.globalAlpha = 1 - k; ctx.drawImage(im, x - w/2, y - w*im.height/im.width/2, w, w*im.height/im.width); ctx.restore(); }
  // wrecking balls + chains
  for (const bl of BG.balls){
    const p = bl.body.position, [x, y] = w2s(p.x, p.y), r = 90*s;
    const ax = x, ay = -20;
    ctx.save(); ctx.strokeStyle = '#555'; ctx.lineWidth = 10*s; ctx.setLineDash([22*s, 10*s]);
    ctx.beginPath(); ctx.moveTo(lerp(x, W/2, 0.3), ay); ctx.quadraticCurveTo(x, (ay + y)/2, x, y - r); ctx.stroke(); ctx.restore();
    const im = IMG.f_ball, sw = im.width, sh = im.height;
    ctx.save(); ctx.translate(x, y); ctx.rotate(bl.body.angle);
    ctx.drawImage(im, 0, sh*0.05, sw*0.46, sh*0.95, -r*1.08, -r*1.12, r*2.16, r*2.2); ctx.restore();
  }
  drawParts();
  drawCrane();
  // David
  const kim = IMG['k_' + BG.boy], kh = 330*H/1000, kw = kh*kim.width/kim.height;
  let jy = 0, rot = 0;
  if (BG.boy === 'happy') jy = -Math.abs(Math.sin(BG.boyT*8))*40*H/1000;
  if (BG.boy === 'scared') rot = Math.sin(BG.boyT*30)*0.04;
  ctx.save(); ctx.translate(30*H/1000 + kw/2, H - 10*H/1000 + jy); ctx.rotate(rot); ctx.drawImage(kim, -kw/2, -kh, kw, kh); ctx.restore();
  // demolish button
  if (BG.mode === 'build'){
    const d = demolBtn(), pulse = BG.blocks.length >= 8 || BG.milesHit >= 2 || BG.roofDone ? 1 + Math.sin(T*6)*0.07*(BG.roofDone ? 2 : 1) : 1;
    ctx.save(); ctx.translate(d.x, d.y); ctx.scale(pulse, pulse);
    if (pulse !== 1){ ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 35; }
    const g = ctx.createRadialGradient(-d.r*0.3, -d.r*0.3, d.r*0.1, 0, 0, d.r); g.addColorStop(0, '#ff8a5c'); g.addColorStop(1, '#d1261b');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, d.r, 0, 7); ctx.fill(); ctx.shadowBlur = 0; ctx.lineWidth = d.r*0.1; ctx.strokeStyle = '#fff'; ctx.stroke();
    const im = IMG.f_ball, iw = d.r*1.5, ih = iw*im.height/im.width; ctx.drawImage(im, -iw*0.45, -ih*0.75, iw, ih);
    outlined('СНЕСТИ!', 0, d.r*0.55, Math.round(d.r*0.34), '#fff', '#7a0b0b'); ctx.restore();
  }
  // swipe hint
  if (BG.mode === 'demolish' && BG.swipeHint){
    const [tx, ty] = w2s(BG.TX, (BG.topY + SLAB_TOP)/2);
    const k = (T*0.8) % 1, hx = lerp(tx - W*0.25, tx + W*0.25, easeInOut(k));
    ctx.save(); ctx.globalAlpha = k < 0.85 ? 0.95 : (1-k)*6; ctx.font = `${Math.round(H*0.12)}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('👆', hx, ty); ctx.restore();
    outlined('Проведи пальцем по башне!', W/2, H*0.12 + 30*H/1000, Math.round(H*0.06), '#ffe14f', '#3a1d6e');
  }
  if (BG.newBtn){
    const b = newBtnRect(), p = 1 + Math.sin(T*4)*0.04;
    ctx.save(); ctx.translate(b.x + b.w/2, b.y + b.h/2); ctx.scale(p, p);
    ctx.fillStyle = '#3fcf4a'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
    roundRect(-b.w/2, -b.h/2, b.w, b.h, b.h/2); ctx.fill(); ctx.shadowColor = 'transparent'; ctx.stroke();
    outlined('🏗 Построить новую башню!', 0, 3, Math.round(b.h*0.34), '#fff', 'rgba(0,0,0,0.35)'); ctx.restore();
  }
  // sound button (top right)
  const sb = buildSoundBtn();
  ctx.save(); ctx.fillStyle = '#ff9a2e'; ctx.strokeStyle = '#fff'; ctx.lineWidth = sb.r*0.14; ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r, 0, 7); ctx.fill(); ctx.stroke();
  ctx.font = `${Math.round(sb.r*1.0)}px "Noto Color Emoji","Apple Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(soundOn ? '🔊' : '🔇', sb.x, sb.y + 2); ctx.restore();
  // home + HUD (drawn manually, no baked UI here)
  drawHomeBtn();
  drawHud(BG.milesHit, MILES.length, BG.stars);
}
function drawHomeBtn(){
  const x = px(HOME.x), y = py(HOME.y), r = Math.min(px(HOME.r), py(HOME.r)*1.1);
  ctx.save(); ctx.fillStyle = '#c98a4b'; ctx.strokeStyle = '#fff'; ctx.lineWidth = r*0.14; ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
